<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neues Passwort – DHBWMarkt</title>
  <style>
    :root{font-family:Arial,sans-serif;color:#222;background:#f5f5f5}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
    main{width:min(100%,420px);background:#fff;border-radius:16px;padding:28px;box-sizing:border-box;box-shadow:0 8px 30px #0001}
    h1{margin-top:0;font-size:1.6rem} p{line-height:1.5}
    label{display:block;margin:16px 0 6px}
    input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #bbb;border-radius:8px;font:inherit}
    button{margin-top:18px;width:100%;padding:12px;border:0;border-radius:8px;background:#b40014;color:white;font:inherit;font-weight:bold;cursor:pointer}
    #status{min-height:1.5em} a{color:#b40014}
  </style>
</head>
<body>
<main>
  <h1>Neues Passwort festlegen</h1>
  <p>Gib ein neues Passwort für dein DHBWMarkt-Konto ein.</p>
  <form id="passwordForm">
    <label for="password">Neues Passwort</label>
    <input id="password" type="password" minlength="8" autocomplete="new-password" required>
    <label for="confirm">Passwort wiederholen</label>
    <input id="confirm" type="password" minlength="8" autocomplete="new-password" required>
    <button type="submit">Passwort speichern</button>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
  <a href="anmeldeseite_regestrierung.html">Zur Anmeldung</a>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
"use strict";
const db = window.supabase.createClient(window.DHBWMARKT_SUPABASE_URL, window.DHBWMARKT_SUPABASE_PUBLISHABLE_KEY);
const form = document.getElementById("passwordForm");
const status = document.getElementById("status");
db.auth.getSession().then(({data,error}) => {
  if(error || !data.session) {
    status.textContent = "Der Reset-Link ist ungültig oder abgelaufen. Bitte fordere einen neuen Link an.";
    form.hidden = true;
  }
});
form.addEventListener("submit", async (event) => {
  event.preventDefault();
  const password = document.getElementById("password").value;
  const confirm = document.getElementById("confirm").value;
  if(password.length < 8) { status.textContent = "Das Passwort muss mindestens 8 Zeichen lang sein."; return; }
  if(password !== confirm) { status.textContent = "Die Passwörter stimmen nicht überein."; return; }
  const {error} = await db.auth.updateUser({password});
  if(error) { status.textContent = error.message; return; }
  status.textContent = "Passwort erfolgreich geändert. Du kannst dich jetzt anmelden.";
  form.hidden = true;
  await db.auth.signOut();
});
</script>
</body>
</html>
