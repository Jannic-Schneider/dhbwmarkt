<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anmelden | dhbwmarkt</title>

  <style>
    /* Lightmode */
       :root {
      --red: #e2001a;
      --red-dark: #b40014;
      --black: #1a1a1a;
      --grey-dark: #4a4a4a;
      --grey: #5f5f5f;
      --grey-light: #8c8c8c;
      --ink: #1a1a1a;
      --ink-soft: #5f5f5f;
      --bg: #ffffff;
      --bg-alt: #f5f5f5;
      --border: #e1e1e1;
      --border-strong: #c7c7c7;
      --white: #ffffff;
    
    }

    body.dark-mode {
      --black: #f5f5f5;
      --ink: #f5f5f5;
      --ink-soft: #b8b8b8;
      --bg: #282828;
      --bg-alt: #101010;
      --border: #383838;
      --border-strong: #555555;
    }

/* Darkmode der Anmeldeseite */

body.dark-mode {
  background: #101010;
  color: #f5f5f5;
}

body.dark-mode .header,
body.dark-mode .login-card {
  background: #1c1c1c;
  color: #f5f5f5;
}

body.dark-mode .login-card {
  border-color: #444444;
}

body.dark-mode .login-card h1,
body.dark-mode .form-group > label,
body.dark-mode .remember {
  color: #f5f5f5;
}

body.dark-mode .intro,
body.dark-mode .register-text {
  color: #b8b8b8;
}

body.dark-mode input,
body.dark-mode select {
  background: #242424;
  color: #f5f5f5;
  border-color: #666666;
}

body.dark-mode input::placeholder {
  color: #a8a8a8;
  opacity: 1;
}

body.dark-mode .show-password,
body.dark-mode .forgot-link,
body.dark-mode .register-text a {
  color: #ff4055;
}

body.dark-mode .logo {
  color: #f5f5f5;
}


    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--background);
      color: var(--black);
      font-family: Arial, Helvetica, sans-serif;
    }

    button,
    input,
    select {
      font: inherit;
    }

    :focus-visible {
      outline: 3px solid rgba(226, 0, 26, 0.25);
      outline-offset: 2px;
    }

    .header {
      width: 100%;
      padding: 18px 24px;
      background: var(--white);
      border-bottom: 3px solid var(--red);
    }

    .header-content {
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      color: var(--black);
      font-size: 27px;
      font-weight: 900;
      letter-spacing: -0.5px;
      text-decoration: none;
    }

    .logo-red {
      color: var(--red);
    }

    .main {
      width: 100%;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 20px;
    }

    .login-card {
      width: 100%;
      max-width: 430px;
      padding: 34px;
      background: var(--white);
      border: 1px solid #e1e1e1;
      border-top: 5px solid var(--red);
      border-radius: 8px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.08);
    }

    .login-card h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .intro {
      margin: 0 0 28px;
      color: var(--grey);
      font-size: 14px;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 700;
    }

    input, select {
      width: 100%;
      padding: 12px 14px;
      color: var(--black);
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 5px;
      font-size: 15px;
    }

    input:focus, select:focus {
      border-color: var(--red);
      outline: 3px solid rgba(226, 0, 26, 0.12);
    }

    select {
      cursor: pointer;
    }

    .password-wrapper {
      position: relative;
    }

    .password-wrapper input {
      padding-right: 76px;
    }

    .show-password {
      position: absolute;
      top: 50%;
      right: 10px;
      transform: translateY(-50%);
      padding: 5px;
      color: var(--red);
      background: transparent;
      border: 0;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 4px 0 24px;
      font-size: 13px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 7px;
      margin: 0;
      font-weight: 400;
      cursor: pointer;
    }

    .remember input {
      width: auto;
      accent-color: var(--red);
    }

    .forgot-link {
      color: var(--red);
      font-weight: 700;
      text-decoration: none;
    }

    .forgot-link:hover {
      text-decoration: underline;
    }

    .login-button {
      width: 100%;
      padding: 12px 18px;
      color: var(--white);
      background: var(--red);
      border: 0;
      border-radius: 24px;
      font-weight: 700;
      cursor: pointer;
    }

    .login-button:hover {
      background: var(--red-dark);
    }

    .status-message {
      min-height: 20px;
      margin: 16px 0 0;
      color: var(--grey);
      font-size: 13px;
      line-height: 1.45;
      text-align: center;
    }

    .register-text {
      margin: 24px 0 0;
      padding-top: 20px;
      border-top: 1px solid #e7e7e7;
      color: var(--grey);
      font-size: 14px;
      text-align: center;
    }

    .register-text a {
      color: var(--red);
      font-weight: 700;
      text-decoration: none;
    }

    .register-text a:hover {
      text-decoration: underline;
    }

    /* Wiederherstellungscode */
    .recovery-code {
      margin: 0 0 16px;
      padding: 18px 12px;
      color: var(--ink);
      background: var(--bg-alt);
      border: 2px dashed var(--red);
      border-radius: 8px;
      font-family: "Courier New", monospace;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 2px;
      text-align: center;
      user-select: all;
    }

    .secondary-button {
      width: 100%;
      margin-top: 10px;
      padding: 12px 18px;
      color: var(--ink);
      background: transparent;
      border: 1px solid var(--border-strong);
      border-radius: 24px;
      font-weight: 700;
      cursor: pointer;
    }

    .secondary-button:hover {
      border-color: var(--red);
      color: var(--red);
    }

    [hidden] {
      display: none !important;
    }

    .footer {
      width: 100%;
      padding: 18px 24px;
      color: var(--white);
      background: var(--red);
    }

    .footer-content {
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      font-size: 14px;
    }

    .footer a {
      color: #ffffff;
      font-weight: 700;
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    @media (max-width: 520px) {
      .header {
        padding: 15px 16px;
      }

      .logo {
        font-size: 23px;
      }

      .main {
        align-items: flex-start;
        padding: 28px 14px;
      }

      .login-card {
        padding: 26px 20px;
      }

      .options {
        align-items: flex-start;
        flex-direction: column;
        gap: 12px;
      }

      .recovery-code {
        font-size: 19px;
      }

      .footer-content {
        align-items: flex-start;
        flex-direction: column;
        gap: 10px;
      }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-content">
      <a class="logo" href="index.html" aria-label="Zur DHBWMarkt-Hauptseite">
        <span class="logo-red">dhbw</span><span>markt</span>
      </a>
    </div>
  </header>
<main class="main">
 <section class="login-card" aria-labelledby="formHeading">

<h1 id="formHeading">Anmelden</h1>

<p class="intro" id="formIntro">
Melde dich an, um den DHBW-Marktplatz zu nutzen.
 </p>

<form id="loginForm">

<div class="form-group">
 <label for="loginEmail">E-Mail-Adresse</label>
 <input
 id="loginEmail"
 name="loginEmail"
 type="email"
 placeholder="name@beispiel.de"
 autocomplete="email"
 required
 >
 </div>

<div class="form-group">
 <label for="loginPassword">Passwort</label>

<div class="password-wrapper">
 <input
 id="loginPassword"
 name="loginPassword"
 type="password"
 placeholder="Passwort eingeben"
 autocomplete="current-password"
 required
 >

 <button
 class="show-password"
 id="showLoginPasswordButton"
 type="button">
 Anzeigen
 </button>
 </div>
 </div>

<div class="options">
 <label class="remember" for="rememberMe">
 <input id="rememberMe" name="rememberMe" type="checkbox">
 Angemeldet bleiben
 </label>

 <a href="#" class="forgot-link" id="forgotLink">Passwort vergessen?</a>

 </div>

<button class="login-button" type="submit">
 Anmelden
 </button>

<p class="status-message" id="loginStatusMessage" aria-live="polite"></p>
 </form>

<form id="registerForm" hidden>
  <div class="form-group">
  <label for="registerName">Vor- und Nachname</label>

  <input
    id="registerName"
    name="registerName"
    type="text"
    placeholder="Max Mustermann"
    autocomplete="name"
    minlength="2"
    required
  >
</div>

<div class="form-group">
 <label for="registerEmail">E-Mail-Adresse</label>
 <input
 id="registerEmail"
 name="registerEmail"
 type="email"
 placeholder="name@beispiel.de"
 autocomplete="email"
 required
 >
 </div>

<div class="form-group">
 <label for="registerPassword">Passwort</label>
 <input
 id="registerPassword"
 name="registerPassword"
 type="password"
 placeholder="Passwort eingeben"
 autocomplete="new-password"
 minlength="6"
 required
 >
 </div>

<div class="form-group">
 <label for="confirmPassword">Passwort bestätigen</label>
 <input
 id="confirmPassword"
 name="confirmPassword"
 type="password"
 placeholder="Passwort erneut eingeben"
 autocomplete="new-password"
 minlength="6"
 required
 >
 </div>

<div class="form-group">
 <label for="wohnheim">Wohnheim auswählen</label>
 <select id="wohnheim" name="wohnheim" required>
 <option value="">Bitte auswählen</option>
 </select>
 </div>

<button class="login-button" type="submit">
 Konto erstellen
 </button>

<p class="status-message" id="registerStatusMessage" aria-live="polite"></p>
 </form>

<!-- Passwort zurücksetzen -->
<form id="resetForm" hidden>
  <div class="form-group">
    <label for="resetEmail">E-Mail-Adresse</label>
    <input id="resetEmail" type="email" autocomplete="email" required>
  </div>

  <button class="login-button" type="submit">Reset-Link per E-Mail anfordern</button>
  <p class="status-message" id="resetStatusMessage" aria-live="polite"></p>
  <p class="register-text"><a href="#" id="backToLogin">Zurück zur Anmeldung</a></p>
</form>

<!-- Anzeige des Wiederherstellungscodes -->
<div id="codeBox" hidden>
  <div class="recovery-code" id="recoveryCodeDisplay"></div>
  <button class="login-button" type="button" id="codeSavedButton">Ich habe den Code gespeichert</button>
  <button class="secondary-button" type="button" id="copyCodeButton">Code kopieren</button>
</div>

<p class="register-text" id="switchRow">
 <span id="switchText">Noch kein Konto?</span>
 <a href="#" id="switchFormLink">Jetzt registrieren</a>
 </p>

</section>
 </main>
  
  <footer class="footer">
    <div class="footer-content">
      <span>&copy; 2026 dhbwmarkt</span>
      <a href="impressum.html">Impressum</a>
    </div>
  </footer>

 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="auth-supabase.js"></script>
<script>
"use strict";
function istNacht() {
  const test = localStorage.getItem("testNacht");
  if (test === "an") return true;
  if (test === "aus") return false;
  const stunde = new Date().getHours();
  return stunde >= 20 || stunde < 7;
}
function ladeGespeichertesTheme() {
  const auto = localStorage.getItem("autoTheme") === "on";
  const dunkel = auto ? istNacht() : localStorage.getItem("theme") === "dark";
  document.body.classList.toggle("dark-mode", dunkel);
}
ladeGespeichertesTheme();
</script>
</body>
</html>
