<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anmelden | dhbwmarkt</title>

  <style>
    /* Lightmode */
       :root {
      --red: #e2001a;
      --red-dark: #b40014;
      --black: #1a1a1a;
      --grey-dark: #4a4a4a;
      --grey: #5f5f5f;
      --grey-light: #8c8c8c;
      --ink: #1a1a1a;
      --ink-soft: #5f5f5f;
      --bg: #ffffff;
      --bg-alt: #f5f5f5;
      --border: #e1e1e1;
      --border-strong: #c7c7c7;
      --white: #ffffff;
    
    }

    body.dark-mode {
      --black: #f5f5f5;
      --ink: #f5f5f5;
      --ink-soft: #b8b8b8;
      --bg: #282828;
      --bg-alt: #101010;
      --border: #383838;
      --border-strong: #555555;
    }

/* Darkmode der Anmeldeseite */

body.dark-mode {
  background: #101010;
  color: #f5f5f5;
}

body.dark-mode .header,
body.dark-mode .login-card {
  background: #1c1c1c;
  color: #f5f5f5;
}

body.dark-mode .login-card {
  border-color: #444444;
}

body.dark-mode .login-card h1,
body.dark-mode .form-group > label,
body.dark-mode .remember {
  color: #f5f5f5;
}

body.dark-mode .intro,
body.dark-mode .register-text {
  color: #b8b8b8;
}

body.dark-mode input,
body.dark-mode select {
  background: #242424;
  color: #f5f5f5;
  border-color: #666666;
}

body.dark-mode input::placeholder {
  color: #a8a8a8;
  opacity: 1;
}

body.dark-mode .show-password,
body.dark-mode .forgot-link,
body.dark-mode .register-text a {
  color: #ff4055;
}

body.dark-mode .logo {
  color: #f5f5f5;
}


    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--background);
      color: var(--black);
      font-family: Arial, Helvetica, sans-serif;
    }

    button,
    input,
    select {
      font: inherit;
    }

    :focus-visible {
      outline: 3px solid rgba(226, 0, 26, 0.25);
      outline-offset: 2px;
    }

    .header {
      width: 100%;
      padding: 18px 24px;
      background: var(--white);
      border-bottom: 3px solid var(--red);
    }

    .header-content {
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      color: var(--black);
      font-size: 27px;
      font-weight: 900;
      letter-spacing: -0.5px;
      text-decoration: none;
    }

    .logo-red {
      color: var(--red);
    }

    .main {
      width: 100%;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 20px;
    }

    .login-card {
      width: 100%;
      max-width: 430px;
      padding: 34px;
      background: var(--white);
      border: 1px solid #e1e1e1;
      border-top: 5px solid var(--red);
      border-radius: 8px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.08);
    }

    .login-card h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .intro {
      margin: 0 0 28px;
      color: var(--grey);
      font-size: 14px;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 700;
    }

    input, select {
      width: 100%;
      padding: 12px 14px;
      color: var(--black);
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 5px;
      font-size: 15px;
    }

    input:focus, select:focus {
      border-color: var(--red);
      outline: 3px solid rgba(226, 0, 26, 0.12);
    }

    select {
      cursor: pointer;
    }

    .password-wrapper {
      position: relative;
    }

    .password-wrapper input {
      padding-right: 76px;
    }

    .show-password {
      position: absolute;
      top: 50%;
      right: 10px;
      transform: translateY(-50%);
      padding: 5px;
      color: var(--red);
      background: transparent;
      border: 0;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 4px 0 24px;
      font-size: 13px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 7px;
      margin: 0;
      font-weight: 400;
      cursor: pointer;
    }

    .remember input {
      width: auto;
      accent-color: var(--red);
    }

    .forgot-link {
      color: var(--red);
      font-weight: 700;
      text-decoration: none;
    }

    .forgot-link:hover {
      text-decoration: underline;
    }

    .login-button {
      width: 100%;
      padding: 12px 18px;
      color: var(--white);
      background: var(--red);
      border: 0;
      border-radius: 24px;
      font-weight: 700;
      cursor: pointer;
    }

    .login-button:hover {
      background: var(--red-dark);
    }

    .status-message {
      min-height: 20px;
      margin: 16px 0 0;
      color: var(--grey);
      font-size: 13px;
      line-height: 1.45;
      text-align: center;
    }

    .register-text {
      margin: 24px 0 0;
      padding-top: 20px;
      border-top: 1px solid #e7e7e7;
      color: var(--grey);
      font-size: 14px;
      text-align: center;
    }

    .register-text a {
      color: var(--red);
      font-weight: 700;
      text-decoration: none;
    }

    .register-text a:hover {
      text-decoration: underline;
    }

    /* Wiederherstellungscode */
    .recovery-code {
      margin: 0 0 16px;
      padding: 18px 12px;
      color: var(--ink);
      background: var(--bg-alt);
      border: 2px dashed var(--red);
      border-radius: 8px;
      font-family: "Courier New", monospace;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 2px;
      text-align: center;
      user-select: all;
    }

    .secondary-button {
      width: 100%;
      margin-top: 10px;
      padding: 12px 18px;
      color: var(--ink);
      background: transparent;
      border: 1px solid var(--border-strong);
      border-radius: 24px;
      font-weight: 700;
      cursor: pointer;
    }

    .secondary-button:hover {
      border-color: var(--red);
      color: var(--red);
    }

    [hidden] {
      display: none !important;
    }

    .footer {
      width: 100%;
      padding: 18px 24px;
      color: var(--white);
      background: var(--red);
    }

    .footer-content {
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      font-size: 14px;
    }

    .footer a {
      color: #ffffff;
      font-weight: 700;
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    @media (max-width: 520px) {
      .header {
        padding: 15px 16px;
      }

      .logo {
        font-size: 23px;
      }

      .main {
        align-items: flex-start;
        padding: 28px 14px;
      }

      .login-card {
        padding: 26px 20px;
      }

      .options {
        align-items: flex-start;
        flex-direction: column;
        gap: 12px;
      }

      .recovery-code {
        font-size: 19px;
      }

      .footer-content {
        align-items: flex-start;
        flex-direction: column;
        gap: 10px;
      }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-content">
      <a class="logo" href="#" aria-label="dhbwmarkt">
        <span class="logo-red">dhbw</span><span>markt</span>
      </a>
    </div>
  </header>
<main class="main">
 <section class="login-card" aria-labelledby="formHeading">

<h1 id="formHeading">Anmelden</h1>

<p class="intro" id="formIntro">
Melde dich an, um den DHBW-Marktplatz zu nutzen.
 </p>

<form id="loginForm">

<div class="form-group">
 <label for="loginEmail">E-Mail-Adresse</label>
 <input
 id="loginEmail"
 name="loginEmail"
 type="email"
 placeholder="name@beispiel.de"
 autocomplete="email"
 required
 >
 </div>

<div class="form-group">
 <label for="loginPassword">Passwort</label>

<div class="password-wrapper">
 <input
 id="loginPassword"
 name="loginPassword"
 type="password"
 placeholder="Passwort eingeben"
 autocomplete="current-password"
 required
 >

 <button
 class="show-password"
 id="showLoginPasswordButton"
 type="button">
 Anzeigen
 </button>
 </div>
 </div>

<div class="options">
 <label class="remember" for="rememberMe">
 <input id="rememberMe" name="rememberMe" type="checkbox">
 Angemeldet bleiben
 </label>

 <a href="#" class="forgot-link" id="forgotLink">Passwort vergessen?</a>

 </div>

<button class="login-button" type="submit">
 Anmelden
 </button>

<p class="status-message" id="loginStatusMessage" aria-live="polite"></p>
 </form>

<form id="registerForm" hidden>
  <div class="form-group">
  <label for="registerName">Vor- und Nachname</label>

  <input
    id="registerName"
    name="registerName"
    type="text"
    placeholder="Max Mustermann"
    autocomplete="name"
    minlength="2"
    required
  >
</div>

<div class="form-group">
 <label for="registerEmail">E-Mail-Adresse</label>
 <input
 id="registerEmail"
 name="registerEmail"
 type="email"
 placeholder="name@beispiel.de"
 autocomplete="email"
 required
 >
 </div>

<div class="form-group">
 <label for="registerPassword">Passwort</label>
 <input
 id="registerPassword"
 name="registerPassword"
 type="password"
 placeholder="Passwort eingeben"
 autocomplete="new-password"
 minlength="6"
 required
 >
 </div>

<div class="form-group">
 <label for="confirmPassword">Passwort bestätigen</label>
 <input
 id="confirmPassword"
 name="confirmPassword"
 type="password"
 placeholder="Passwort erneut eingeben"
 autocomplete="new-password"
 minlength="6"
 required
 >
 </div>

<div class="form-group">
 <label for="wohnheim">Wohnheim auswählen</label>
 <select id="wohnheim" name="wohnheim" required>
 <option value="">Bitte auswählen</option>
 </select>
 </div>

<button class="login-button" type="submit">
 Konto erstellen
 </button>

<p class="status-message" id="registerStatusMessage" aria-live="polite"></p>
 </form>

<!-- Passwort zurücksetzen -->
<form id="resetForm" hidden>
  <div class="form-group">
    <label for="resetEmail">E-Mail-Adresse</label>
    <input id="resetEmail" type="email" autocomplete="email" required>
  </div>

  <div class="form-group">
    <label for="resetCode">Wiederherstellungscode</label>
    <input id="resetCode" type="text" placeholder="XXXX-XXXX-XXXX" autocomplete="off" required>
  </div>

  <div class="form-group">
    <label for="resetNewPassword">Neues Passwort</label>
    <input id="resetNewPassword" type="password" minlength="6" autocomplete="new-password" required>
  </div>

  <div class="form-group">
    <label for="resetNewPasswordConfirm">Neues Passwort bestätigen</label>
    <input id="resetNewPasswordConfirm" type="password" minlength="6" autocomplete="new-password" required>
  </div>

  <button class="login-button" type="submit">Passwort zurücksetzen</button>
  <p class="status-message" id="resetStatusMessage" aria-live="polite"></p>
  <p class="register-text"><a href="#" id="backToLogin">Zurück zur Anmeldung</a></p>
</form>

<!-- Anzeige des Wiederherstellungscodes -->
<div id="codeBox" hidden>
  <div class="recovery-code" id="recoveryCodeDisplay"></div>
  <button class="login-button" type="button" id="codeSavedButton">Ich habe den Code gespeichert</button>
  <button class="secondary-button" type="button" id="copyCodeButton">Code kopieren</button>
</div>

<p class="register-text" id="switchRow">
 <span id="switchText">Noch kein Konto?</span>
 <a href="#" id="switchFormLink">Jetzt registrieren</a>
 </p>

</section>
 </main>
  
  <footer class="footer">
    <div class="footer-content">
      <span>&copy; 2026 dhbwmarkt</span>
      <a href="impressum.html">Impressum</a>
    </div>
  </footer>

 <script>

"use strict";

const WOHNHEIME = [
 "Kein Wohnheim / außerhalb eines Wohnheims",
 "Am Verbindungskanal – Hafenstraße 35–45, 68159 Mannheim",
 "Augartenstraße – Augartenstraße 112–114, 68165 Mannheim",
 "B 6 – B 6, 14–15, 68159 Mannheim",
 "B 7 – B 7, 14–15, 68159 Mannheim",
 "Carl-Zuckmayer-Straße – Carl-Zuckmayer-Straße 13–17, 68169 Mannheim",
 "Eastsite – Seckenheimer Landstraße 4a, 68163 Mannheim",
 "G 7 – G 7, 26–28, 68159 Mannheim",
 "Hans-Sachs-Ring / Steubenstraße – Hans-Sachs-Ring 1–5 und Steubenstraße 80, 68199 Mannheim",
 "L 8 – L 8, 13–14, 68161 Mannheim",
 "Neckarauer Straße – Neckarauer Straße 169–175, 68199 Mannheim",
 "Parkring – Parkring 21, 68159 Mannheim",
 "Studentensiedlung Ludwig Frank – Ulmenweg 55, 68167 Mannheim",
 "Speyerer Straße – Speyerer Straße 39–57, 68199 Mannheim",
 "N 6 / Hermann-Heimerich-Haus – N 6, 8, 68161 Mannheim"
 ];

const standardUsers = [
{
  id:"admin",
  name: "Admin",
  email: "admin@dhbw.de",
  password:"Admin123",
  wohnheim: "Kein Wohnheim / außerhalb eines Wohnheims",
  role: "admin"


}
];
// Standard-Profilbild für Admin
if (!localStorage.getItem("profileImage-admin")) {
localStorage.setItem(
"profileImage-admin",
"AdminPB.png"
);
}


const formHeading = document.getElementById("formHeading");
 const formIntro = document.getElementById("formIntro");

const loginForm = document.getElementById("loginForm");
 const registerForm = document.getElementById("registerForm");

const loginEmailInput = document.getElementById("loginEmail");
 const loginPasswordInput = document.getElementById("loginPassword");
 const showLoginPasswordButton = document.getElementById("showLoginPasswordButton");
 const loginStatusMessage = document.getElementById("loginStatusMessage");

const registerNameInput =
  document.getElementById("registerName");
const registerEmailInput = document.getElementById("registerEmail");
 const registerPasswordInput = document.getElementById("registerPassword");
 const confirmPasswordInput = document.getElementById("confirmPassword");
 const wohnheimSelect = document.getElementById("wohnheim");
 const registerStatusMessage = document.getElementById("registerStatusMessage");

const switchText = document.getElementById("switchText");
 const switchFormLink = document.getElementById("switchFormLink");

let registrationIsOpen = false;

WOHNHEIME.forEach(function (wohnheim) {
 const option = document.createElement("option");
 option.value = wohnheim;
 option.textContent = wohnheim;
 wohnheimSelect.appendChild(option);
 });

switchFormLink.addEventListener("click", function (event) {
 event.preventDefault();

registrationIsOpen = !registrationIsOpen;

loginStatusMessage.textContent = "";
 registerStatusMessage.textContent = "";

if (registrationIsOpen) {
 loginForm.hidden = true;
 registerForm.hidden = false;

formHeading.textContent = "Registrieren";
 formIntro.textContent = "Erstelle ein Konto für den DHBW-Marktplatz.";

switchText.textContent = "Bereits registriert?";
 switchFormLink.textContent = "Jetzt anmelden";
 } else {
 registerForm.hidden = true;
 loginForm.hidden = false;

formHeading.textContent = "Anmelden";
 formIntro.textContent = "Melde dich an, um den DHBW-Marktplatz zu nutzen.";

switchText.textContent = "Noch kein Konto?";
 switchFormLink.textContent = "Jetzt registrieren";
 }
 });

showLoginPasswordButton.addEventListener("click", function () {
 const passwordIsHidden = loginPasswordInput.type === "password";

loginPasswordInput.type = passwordIsHidden ? "text" : "password";
 showLoginPasswordButton.textContent = passwordIsHidden ? "Ausblenden" : "Anzeigen";
 });

// ===== Wiederherstellungscode =====

function erzeugeWiederherstellungscode() {
  const zeichen = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // ohne 0/O/1/I
  const zufall = new Uint32Array(12);
  crypto.getRandomValues(zufall);

  let code = "";
  for (let i = 0; i < 12; i++) {
    if (i > 0 && i % 4 === 0) code += "-";
    code += zeichen[zufall[i] % zeichen.length];
  }
  return code;
}

function normalisiereCode(text) {
  return String(text || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
}

const resetForm = document.getElementById("resetForm");
const resetEmail = document.getElementById("resetEmail");
const resetCode = document.getElementById("resetCode");
const resetNewPassword = document.getElementById("resetNewPassword");
const resetNewPasswordConfirm = document.getElementById("resetNewPasswordConfirm");
const resetStatusMessage = document.getElementById("resetStatusMessage");
const codeBox = document.getElementById("codeBox");
const recoveryCodeDisplay = document.getElementById("recoveryCodeDisplay");
const copyCodeButton = document.getElementById("copyCodeButton");
const codeSavedButton = document.getElementById("codeSavedButton");
const switchRow = document.getElementById("switchRow");

let emailNachCodeAnzeige = "";

function resetStatus(text, farbe) {
  resetStatusMessage.textContent = text;
  resetStatusMessage.style.color = farbe;
}

function zeigeLogin() {
  registrationIsOpen = false;

  loginForm.hidden = false;
  registerForm.hidden = true;
  resetForm.hidden = true;
  codeBox.hidden = true;
  switchRow.hidden = false;

  formHeading.textContent = "Anmelden";
  formIntro.textContent = "Melde dich an, um den DHBW-Marktplatz zu nutzen.";
  switchText.textContent = "Noch kein Konto?";
  switchFormLink.textContent = "Jetzt registrieren";
}

function zeigeResetFormular() {
  loginForm.hidden = true;
  registerForm.hidden = true;
  codeBox.hidden = true;
  resetForm.hidden = false;
  switchRow.hidden = true;

  resetForm.reset();
  resetStatus("", "");

  formHeading.textContent = "Passwort zurücksetzen";
  formIntro.textContent = "Gib deine E-Mail-Adresse und deinen Wiederherstellungscode ein.";
}

function zeigeCode(code, text, email) {
  loginForm.hidden = true;
  registerForm.hidden = true;
  resetForm.hidden = true;
  switchRow.hidden = true;
  codeBox.hidden = false;

  recoveryCodeDisplay.textContent = code;
  emailNachCodeAnzeige = email || "";
  copyCodeButton.textContent = "Code kopieren";

  formHeading.textContent = "Dein Wiederherstellungscode";
  formIntro.textContent = text;
}

document.getElementById("forgotLink").addEventListener("click", function (e) {
  e.preventDefault();
  loginStatusMessage.textContent = "";
  zeigeResetFormular();
});

document.getElementById("backToLogin").addEventListener("click", function (e) {
  e.preventDefault();
  zeigeLogin();
});

copyCodeButton.addEventListener("click", function () {
  const code = recoveryCodeDisplay.textContent;

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(code).then(function () {
      copyCodeButton.textContent = "Kopiert ✓";
    }).catch(function () {
      copyCodeButton.textContent = "Bitte manuell kopieren";
    });
  } else {
    copyCodeButton.textContent = "Bitte manuell kopieren";
  }
});

codeSavedButton.addEventListener("click", function () {
  zeigeLogin();
  loginEmailInput.value = emailNachCodeAnzeige;
  recoveryCodeDisplay.textContent = "";
});

resetForm.addEventListener("submit", function (event) {
  event.preventDefault();

  const email = resetEmail.value.trim().toLowerCase();
  const code = normalisiereCode(resetCode.value);
  const neu = resetNewPassword.value;
  const bestaetigung = resetNewPasswordConfirm.value;

  const registrierte = JSON.parse(localStorage.getItem("registeredUsers")) || [];

  const index = registrierte.findIndex(function (u) {
    return String(u.email).toLowerCase() === email;
  });

  // Bewusst eine gemeinsame Meldung für "E-Mail unbekannt" und "Code falsch"
  if (
    index === -1 ||
    !registrierte[index].recoveryCode ||
    normalisiereCode(registrierte[index].recoveryCode) !== code
  ) {
    resetStatus("E-Mail-Adresse oder Wiederherstellungscode ist falsch.", "red");
    return;
  }

  if (neu.length < 6) {
    resetStatus("Das Passwort muss mindestens 6 Zeichen lang sein.", "red");
    return;
  }

  if (neu !== bestaetigung) {
    resetStatus("Die Passwörter stimmen nicht überein.", "red");
    return;
  }

  // Code ist nur einmal gültig, daher sofort einen neuen erzeugen
  const neuerCode = erzeugeWiederherstellungscode();

  registrierte[index] = {
    ...registrierte[index],
    password: neu,
    recoveryCode: neuerCode
  };

  localStorage.setItem("registeredUsers", JSON.stringify(registrierte));

  zeigeCode(
    neuerCode,
    "Dein Passwort wurde geändert. Dein alter Code ist ungültig, bitte speichere diesen neuen Code.",
    email
  );
});

registerForm.addEventListener("submit", function (event) {
 event.preventDefault();
const name =
  registerNameInput.value.trim();
const email = registerEmailInput.value.trim().toLowerCase();

if (name.length < 2) {
  registerStatusMessage.textContent =
    "Bitte gib deinen Namen ein.";

  registerStatusMessage.style.color = "red";
  return;
}

 const password = registerPasswordInput.value;
 const confirmedPassword = confirmPasswordInput.value;
 const wohnheim = wohnheimSelect.value;

if (password !== confirmedPassword) {
 registerStatusMessage.textContent = "Die Passwörter stimmen nicht überein.";
 registerStatusMessage.style.color = "red";
 return;
 }

const registeredUsers = JSON.parse(localStorage.getItem("registeredUsers")) || [];

const allUsers = standardUsers.concat(registeredUsers);

const emailAlreadyExists = allUsers.some(function (user) {
 return user.email.toLowerCase() === email;
 });

if (emailAlreadyExists) {
 registerStatusMessage.textContent = "Diese E-Mail-Adresse ist bereits registriert.";
 registerStatusMessage.style.color = "red";
 return;
 }

const newUser = {
  id: "user-" + Date.now(),
  name: name,
  email: email,
  password: password,
  wohnheim: wohnheim,
  role: "user",
  recoveryCode: erzeugeWiederherstellungscode()
};

registeredUsers.push(newUser);

localStorage.setItem(
 "registeredUsers",
 JSON.stringify(registeredUsers)
 );

registerForm.reset();
registerStatusMessage.textContent = "";
zeigeCode(
  newUser.recoveryCode,
  "Registrierung erfolgreich! Bewahre diesen Code gut auf. Du brauchst ihn, falls du dein Passwort vergisst.",
  email
);
 });

loginForm.addEventListener("submit", function (event) {
  event.preventDefault();

  const enteredEmail =
    loginEmailInput.value.trim().toLowerCase();

  const enteredPassword =
    loginPasswordInput.value;

  const registeredUsers =
    JSON.parse(
      localStorage.getItem("registeredUsers")
    ) || [];

  const allUsers =
    standardUsers.concat(registeredUsers);

  const matchingUser =
    allUsers.find(function (user) {
      return (
        user.email.toLowerCase() === enteredEmail &&
        user.password === enteredPassword
      );
    });

  if (!matchingUser) {
    loginStatusMessage.textContent =
      "E-Mail-Adresse oder Passwort ist falsch.";

    loginStatusMessage.style.color = "red";
    return;
  }

  loginStatusMessage.textContent =
    "Anmeldung erfolgreich.";

  loginStatusMessage.style.color = "green";

const eingeloggterBenutzer = {
  id: matchingUser.id,
  name: matchingUser.name || matchingUser.email,
  email: matchingUser.email,
  wohnheim: matchingUser.wohnheim,
  role: matchingUser.role || "user"
};

localStorage.setItem(
  "loggedInUser",
  JSON.stringify(eingeloggterBenutzer)
);

  setTimeout(function () {
    window.location.href = "index.html";
  }, 1000);
});

function istNacht() {
  const test = localStorage.getItem("testNacht");
  if (test === "an") return true;
  if (test === "aus") return false;

  const stunde = new Date().getHours();
  return stunde >= 20 || stunde < 7;
}

function ladeGespeichertesTheme() {
  const auto = localStorage.getItem("autoTheme") === "on";

  const dunkel = auto
    ? istNacht()
    : localStorage.getItem("theme") === "dark";

  document.body.classList.toggle("dark-mode", dunkel);
}

ladeGespeichertesTheme();

</script>
</body>
</html>
