<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>DHBW Marktplatz – Hauptseite</title>

  <style>
    /* ==================================================
       1. FARBEN
       ================================================== */

    :root {
      --red: #e2001a;
      --red-dark: #b40014;
      --black: #1a1a1a;
      --grey-dark: #4a4a4a;
      --grey: #5f5f5f;
      --grey-light: #8c8c8c;
      --ink: #1a1a1a;
      --ink-soft: #5f5f5f;
      --bg: #ffffff;
      --bg-alt: #f5f5f5;
      --border: #e1e1e1;
      --border-strong: #c7c7c7;
    }

    body.dark-mode {
      --black: #f5f5f5;
      --ink: #f5f5f5;
      --ink-soft: #b8b8b8;
      --bg: #282828;
      --bg-alt: #101010;
      --border: #383838;
      --border-strong: #555555;
    }


    /* ==================================================
       2. GRUNDLAGEN
       ================================================== */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      color: var(--ink);
      background: var(--bg-alt);
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    h1,
    h2,
    h3 {
      margin: 0;
      font-weight: 700;
    }

    button,
    input,
    select {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: var(--red);
      text-decoration: none;
    }

    :focus-visible {
      outline: 2px solid var(--red);
      outline-offset: 2px;
    }

    .app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }


    /* ==================================================
       3. HEADER
       ================================================== */

    .header {
      position: sticky;
      top: 0;
      z-index: 40;
      padding: 14px 18px 12px;
      background: var(--bg);
      border-bottom: 3px solid var(--red);
    }

    .header-row {
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .logo {
      display: flex;
      flex-shrink: 0;
      padding: 0;
      background: none;
      border: 0;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: -0.5px;
      white-space: nowrap;
    }

    .logo .red {
      color: var(--red);
    }

    .logo .rest {
      color: var(--ink);
    }


    /* ==================================================
       4. SUCHLEISTE
       ================================================== */

    .searchbar {
      min-width: 0;
      flex: 1;
      display: flex;
      overflow: hidden;
      background: var(--bg);
      border: 2px solid var(--black);
      border-radius: 22px;
    }

    .searchbar input {
      min-width: 0;
      flex: 1;
      padding: 10px 16px;
      color: var(--ink);
      background: var(--bg);
      border: 0;
      font-size: 15px;
    }

    .searchbar input::placeholder {
      color: var(--ink-soft);
    }

    .searchbar button {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 20px;
      color: #ffffff;
      background: var(--red);
      border: 0;
      font-size: 14px;
      font-weight: 700;
    }

    .searchbar button:hover {
      background: var(--red-dark);
    }


    /* ==================================================
       5. HEADER-AKTIONEN
       ================================================== */

    .header-actions {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }

    .user-name {
      max-width: 130px;
      overflow: hidden;
      color: var(--ink);
      font-size: 13.5px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .link-btn {
      padding: 0;
      color: var(--ink);
      background: none;
      border: 0;
      font-size: 13.5px;
      font-weight: 500;
      white-space: nowrap;
    }

    .link-btn:hover,
    .link-btn.active {
      color: var(--red);
    }

    .link-btn.active {
      font-weight: 700;
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    .sell-btn {
      padding: 10px 20px;
      color: #ffffff;
      background: var(--red);
      border: 0;
      border-radius: 22px;
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
    }

    .sell-btn:hover {
      background: var(--red-dark);
    }


    /* ==================================================
       6. PROFIL-BUTTON
       ================================================== */

    .profile-button {
      width: 40px;
      height: 40px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
      color: #ffffff;
      background: var(--red);
      border: 1px solid var(--red);
      border-radius: 50%;
      transition:
        background-color 0.15s ease,
        border-color 0.15s ease,
        transform 0.15s ease;
    }

    .profile-button:hover {
      background: var(--red-dark);
      border-color: var(--red-dark);
      transform: translateY(-1px);
    }

    .profile-button:active {
      transform: translateY(0);
    }

    #profileButtonContent {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #profileButtonContent svg {
      display: block;
    }

    #profileButtonContent img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      border-radius: 50%;
    }


    /* ==================================================
       7. BURGER-MENÜ
       ================================================== */

    .burger-btn {
      display: none;
      padding: 8px 10px;
      color: var(--ink);
      background: none;
      border: 1px solid var(--border-strong);
      border-radius: 4px;
      align-items: center;
      justify-content: center;
    }

    .burger-btn:hover {
      color: var(--red);
      border-color: var(--red);
    }

    .burger-menu {
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
      padding: 8px 18px 16px;
      display: none;
      flex-direction: column;
      gap: 2px;
      background: var(--bg);
      border-top: 1px solid var(--border);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
      animation: burgerDrop 0.15s ease;
    }

    .burger-menu.open {
      display: flex;
    }

    @keyframes burgerDrop {
      from {
        opacity: 0;
        transform: translateY(-6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .burger-item {
      padding: 11px 8px;
      color: var(--ink);
      background: none;
      border: 0;
      border-radius: 4px;
      font-size: 14.5px;
      font-weight: 500;
      text-align: left;
    }

    .burger-item:hover {
      background: var(--bg-alt);
    }

    .burger-item.active {
      color: var(--red);
      font-weight: 700;
    }


    /* ==================================================
       8. KATEGORIEN
       ================================================== */

    .catrow {
      max-width: 1180px;
      margin: 10px auto 0;
      display: flex;
      gap: 22px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: thin;
    }

    .catrow button {
      padding: 4px 0;
      color: var(--ink-soft);
      background: none;
      border: 0;
      border-bottom: 2px solid transparent;
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
    }

    .catrow button:hover {
      color: var(--red);
    }

    .catrow button.active {
      color: var(--red);
      border-bottom-color: var(--red);
      font-weight: 700;
    }


    /* ==================================================
       9. INHALT UND KARTEN
       ================================================== */

    .layout {
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
      padding: 18px 18px 80px;
      flex: 1;
    }

    .results-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .results-head .count {
      color: var(--ink-soft);
      font-size: 14px;
    }

    .results-head .count b {
      color: var(--ink);
    }

    .grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fill, minmax(200px, 1fr));
      gap: 14px;
    }

    .card {
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 0;
      color: var(--ink);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      text-align: left;
      transition:
        box-shadow 0.12s ease,
        border-color 0.12s ease;
    }

    .card:hover {
      border-color: var(--border-strong);
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.12);
    }

    .card-media {
      position: relative;
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 10px;
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
    }

    .card-product-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .card-tag {
      position: absolute;
      z-index: 2;
      top: 7px;
      left: 7px;
      padding: 3px 7px;
      color: #ffffff;
      background: #1a1a1a;
      border-radius: 2px;
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .card-tag.tausch {
      background: var(--red);
    }

    .card-body {
      padding: 10px 12px 12px;
    }

    .card-title {
      margin-bottom: 6px;
      overflow: hidden;
      color: var(--ink);
      font-size: 13.5px;
      font-weight: 400;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .card-price {
      color: var(--ink);
      font-size: 16px;
      font-weight: 700;
    }

    .card-price.tausch {
      color: var(--red);
      font-size: 13.5px;
    }


    /* ==================================================
       10. VERKÄUFER AUF DEN KARTEN
       ================================================== */

    .card-seller {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-top: 10px;
    }

    .card-seller-image,
    .card-seller-placeholder {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      border-radius: 50%;
    }

    .card-seller-image {
      display: block;
      object-fit: cover;
      border: 1px solid var(--border);
    }

    .card-seller-placeholder {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      background: var(--red);
      font-size: 11px;
      font-weight: 900;
    }

    .card-seller-name {
      min-width: 0;
      overflow: hidden;
      color: var(--ink-soft);
      font-size: 11.5px;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .card-loc {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 7px;
      color: var(--ink-soft);
      font-size: 11.5px;
    }


    /* ==================================================
       11. LEERER ZUSTAND
       ================================================== */

    .empty-state {
      padding: 60px 20px;
      color: var(--ink-soft);
      background: var(--bg);
      border: 1px solid var(--border);
      text-align: center;
    }

    .empty-state h3 {
      margin-bottom: 8px;
      color: var(--ink);
      font-size: 18px;
    }

    .empty-state p {
      margin: 0;
      font-size: 14px;
    }


    /* ==================================================
       12. FOOTER
       ================================================== */

    .footer {
      width: 100%;
      margin-top: auto;
      padding: 20px 18px;
      color: #ffffff;
      background: var(--red);
    }

    .footer-content {
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      font-size: 14px;
    }

.footer-link {
  padding: 0;
  color: #ffffff;
  background: none;
  border: none;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
}

.footer-link:hover {
  text-decoration: underline;
}

    .footer-link:hover {
      text-decoration: underline;
    }


    /* ==================================================
       13. RESPONSIVE
       ================================================== */

    @media (max-width: 920px) {
      .user-name {
        display: none;
      }
    }

    @media (max-width: 820px) {
      .header-row {
        gap: 10px;
      }

      .logo {
        order: 1;
      }

      .header-actions {
        order: 2;
        margin-left: auto;
      }

      .searchbar {
        order: 3;
        width: 100%;
        flex-basis: 100%;
      }

      .searchbar input {
        width: 100%;
        min-width: 0;
      }

      .searchbar button {
        flex-shrink: 0;
      }
    }

    @media (max-width: 680px) {
      .catrow {
        display: none;
      }

      .burger-btn {
        display: inline-flex;
      }
    }


    @media (max-width: 480px) {
      .header {
        padding: 10px 12px;
      }

      .logo {
        font-size: 21px;
      }

      .header-actions {
        gap: 8px;
      }

      .searchbar {
        margin-top: 8px;
      }

      .searchbar input {
        padding: 10px 12px;
        font-size: 14px;
      }

      .searchbar button {
        padding: 0 13px;
        font-size: 13px;
      }

      .sell-btn {
        padding: 9px 14px;
        font-size: 13px;
      }

      .layout {
        padding: 14px 12px 76px;
      }

      .grid {
        grid-template-columns:
          repeat(auto-fill, minmax(140px, 1fr));
        gap: 10px;
      }

      .card-title {
        font-size: 13px;
      }

      .card-price {
        font-size: 14.5px;
      }

      .footer-content {
        align-items: flex-start;
        flex-direction: column;
        gap: 10px;
      }
    }
  </style>
</head>

<body>
  <div class="app">

    <header class="header">
      <div class="header-row">

        <button
          class="logo"
          type="button"
          id="logoButton"
          aria-label="Alle Anzeigen anzeigen"
        >
          <span class="red">dhbw</span>
          <span class="rest">markt</span>
        </button>

        <form
          class="searchbar"
          id="searchForm"
        >
          <input
            id="searchInput"
            type="text"
            placeholder="Wonach suchst du?"
            aria-label="Anzeigen durchsuchen"
          >

          <button type="submit">
            <svg
              width="17"
              height="17"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.4"
              aria-hidden="true"
            >
              <circle
                cx="11"
                cy="11"
                r="7"
              ></circle>

              <line
                x1="21"
                y1="21"
                x2="16.65"
                y2="16.65"
              ></line>
            </svg>

            Suchen
          </button>
        </form>

        <div class="header-actions">

          <span
            class="user-name"
            id="userName"
          ></span>

          <button
            class="link-btn"
            id="meineanzeigenButton"
            type="button"
          >
            Meine Anzeigen
          </button>

          <button
            class="sell-btn"
            id="sellButton"
            type="button"
          >
            Verkaufen
          </button>

          <button
            class="profile-button"
            id="profileButton"
            type="button"
            aria-label="Profil und Einstellungen öffnen"
            title="Profil und Einstellungen"
          >
            <span id="profileButtonContent">
              <svg
                width="21"
                height="21"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <circle
                  cx="12"
                  cy="8"
                  r="4"
                ></circle>

                <path
                  d="M4 21a8 8 0 0 1 16 0"
                ></path>
              </svg>
            </span>
          </button>

          <button
            class="burger-btn"
            id="burgerButton"
            type="button"
            aria-label="Menü öffnen"
            aria-expanded="false"
          >
            <span
              id="burgerIcon"
              aria-hidden="true"
            ></span>
          </button>

        </div>
      </div>

      <nav
        class="catrow"
        id="categoryNavigation"
        aria-label="Kategorien"
      ></nav>

      <nav
        class="burger-menu"
        id="burgerMenu"
        aria-label="Mobiles Kategorienmenü"
      ></nav>
    </header>

    <main class="layout">
      <div class="results-head">
        <span
          class="count"
          id="resultCount"
        ></span>
      </div>

      <div id="results"></div>
    </main>

<footer class="footer">
  <div class="footer-content">
    <span>&copy; 2026 dhbwmarkt</span>

    <button
      class="footer-link"
      type="button"
      onclick="window.location.href='impressum.html'"
    >
      Impressum
    </button>
  </div>
</footer>

  </div>


  <script>
    "use strict";


    // ==================================================
    // 1. KATEGORIEN
    // ==================================================

    const kategorien = [
      {
        id: "moebel",
        label: "Möbel",
        color: "#4a4a4a"
      },
      {
        id: "elektronik",
        label: "Elektronik",
        color: "#1a1a1a"
      },
      {
        id: "buecher",
        label: "Bücher & Skripte",
        color: "#7a7a7a"
      },
      {
        id: "kueche",
        label: "Küche",
        color: "#b40014"
      },
      {
        id: "fahrrad",
        label: "Fahrrad",
        color: "#2e2e2e"
      },
      {
        id: "kleidung",
        label: "Kleidung",
        color: "#e2001a"
      },
      {
        id: "sonstiges",
        label: "Sonstiges",
        color: "#5f5f5f"
      }
    ];


    // ==================================================
    // 2. ANZEIGEN LADEN
    // ==================================================

    function ladeAnzeigen() {
      try {
        return JSON.parse(
          localStorage.getItem("anzeigen")
        ) || [];
      } catch (fehler) {
        console.error(
          "Anzeigen konnten nicht geladen werden:",
          fehler
        );

        return [];
      }
    }

    let anzeigen = ladeAnzeigen();


    // ==================================================
    // 3. ZUSTÄNDE
    // ==================================================

    let aktuelleKategorie = "";
    let menueOffen = false;
    let nurEigeneAnzeigen = false;


    // ==================================================
    // 4. HTML-ELEMENTE
    // ==================================================

    const searchInput =
      document.getElementById("searchInput");

    const searchForm =
      document.getElementById("searchForm");

    const categoryNavigation =
      document.getElementById(
        "categoryNavigation"
      );

    const burgerMenu =
      document.getElementById("burgerMenu");

    const burgerButton =
      document.getElementById("burgerButton");

    const burgerIcon =
      document.getElementById("burgerIcon");

    const resultCount =
      document.getElementById("resultCount");

    const results =
      document.getElementById("results");

    const logoButton =
      document.getElementById("logoButton");

    const meineanzeigenButton =
      document.getElementById(
        "meineanzeigenButton"
      );

    const sellButton =
      document.getElementById("sellButton");

    const profileButton =
      document.getElementById(
        "profileButton"
      );

    const profileButtonContent =
      document.getElementById(
        "profileButtonContent"
      );

    const userName =
      document.getElementById("userName");


    // ==================================================
    // 5. HILFSFUNKTIONEN
    // ==================================================

    function escapeHtml(text) {
      return String(text ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }


    function ladeBenutzer() {
      try {
        const wert =
          localStorage.getItem(
            "loggedInUser"
          );

        return wert
          ? JSON.parse(wert)
          : null;
      } catch (fehler) {
        console.error(
          "Benutzerdaten konnten nicht geladen werden:",
          fehler
        );

        return null;
      }
    }


    function kategorieNachId(id) {
      return (
        kategorien.find(
          function (kategorie) {
            return kategorie.id === id;
          }
        ) ||
        kategorien[
          kategorien.length - 1
        ]
      );
    }


    function preisText(anzeige) {
      if (anzeige.tausch) {
        return "Zum Tausch";
      }

      const preis =
        Number(anzeige.price);

      if (preis === 0) {
        return "Zu verschenken";
      }

      if (!Number.isFinite(preis)) {
        return "Preis auf Anfrage";
      }

      return (
        preis
          .toFixed(2)
          .replace(".", ",") +
        " €"
      );
    }


    function erstelleInitialen(name) {
      const teile = String(name || "")
        .trim()
        .split(/\s+/)
        .filter(Boolean);

      if (teile.length === 0) {
        return "?";
      }

      return teile
        .slice(0, 2)
        .map(function (teil) {
          return teil
            .charAt(0)
            .toUpperCase();
        })
        .join("");
    }


    function profilbildDesBenutzers(
      benutzer
    ) {
      if (!benutzer) {
        return "";
      }

      return (
        benutzer.profileImage ||
        (
          benutzer.id
            ? localStorage.getItem(
                "profileImage-" +
                benutzer.id
              )
            : ""
        ) ||
        ""
      );
    }


    function profilbildDesVerkaeufers(
      anzeige
    ) {
      if (!anzeige.ownerId) {
        return "";
      }

      return (
        localStorage.getItem(
          "profileImage-" +
          anzeige.ownerId
        ) || ""
      );
    }


    // ==================================================
    // 6. DARKMODE LADEN
    // ==================================================

    function ladeGespeichertesTheme() {
      document.body.classList.toggle(
        "dark-mode",
        localStorage.getItem("theme") ===
          "dark"
      );
    }


    // ==================================================
    // 7. ANGEMELDETEN BENUTZER ANZEIGEN
    // ==================================================

    function zeigeAngemeldetenBenutzer() {
      const benutzer =
        ladeBenutzer();

      if (!benutzer) {
        userName.textContent = "";
        return;
      }

      userName.textContent =
        benutzer.name ||
        benutzer.email ||
        "";
    }


    function ladeProfilbildImHeader() {
      const benutzer =
        ladeBenutzer();

      if (!benutzer) {
        return;
      }

      const profilbild =
        profilbildDesBenutzers(
          benutzer
        );

      profileButtonContent.innerHTML = "";

      if (profilbild) {
        const bild =
          document.createElement("img");

        bild.src = profilbild;
        bild.alt = "Profilbild";

        profileButtonContent.appendChild(
          bild
        );

        return;
      }

      const name =
        benutzer.name ||
        benutzer.email ||
        "";

      if (name) {
        profileButtonContent.textContent =
          erstelleInitialen(name);
      }
    }


    // ==================================================
    // 8. BURGER-ICON
    // ==================================================

    function menuIconHtml() {
      if (menueOffen) {
        return `
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.4"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <line
              x1="5"
              y1="5"
              x2="19"
              y2="19"
            ></line>

            <line
              x1="19"
              y1="5"
              x2="5"
              y2="19"
            ></line>
          </svg>
        `;
      }

      return `
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.4"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <line
            x1="4"
            y1="7"
            x2="20"
            y2="7"
          ></line>

          <line
            x1="4"
            y1="12"
            x2="20"
            y2="12"
          ></line>

          <line
            x1="4"
            y1="17"
            x2="20"
            y2="17"
          ></line>
        </svg>
      `;
    }


    // ==================================================
    // 9. KATEGORIE-BUTTONS
    // ==================================================

    function kategorieButtonsHtml(mobil) {
      const buttonClass =
        mobil ? "burger-item" : "";

      let html = `
        <button
          type="button"
          class="${buttonClass}${
            aktuelleKategorie === ""
              ? " active"
              : ""
          }"
          data-category=""
        >
          Alle Kategorien
        </button>
      `;

      kategorien.forEach(
        function (kategorie) {
          html += `
            <button
              type="button"
              class="${buttonClass}${
                aktuelleKategorie ===
                kategorie.id
                  ? " active"
                  : ""
              }"
              data-category="${escapeHtml(
                kategorie.id
              )}"
            >
              ${escapeHtml(
                kategorie.label
              )}
            </button>
          `;
        }
      );

      return html;
    }


    function renderKategorien() {
      categoryNavigation.innerHTML =
        kategorieButtonsHtml(false);

      burgerMenu.innerHTML =
        kategorieButtonsHtml(true);

      burgerMenu.classList.toggle(
        "open",
        menueOffen
      );

      burgerButton.setAttribute(
        "aria-expanded",
        String(menueOffen)
      );

      burgerButton.setAttribute(
        "aria-label",
        menueOffen
          ? "Menü schließen"
          : "Menü öffnen"
      );

      burgerIcon.innerHTML =
        menuIconHtml();
    }


    // ==================================================
    // 10. ANZEIGENKARTE
    // ==================================================

    function karteHtml(anzeige) {
      const kategorie =
        kategorieNachId(
          anzeige.kategorie
        );

      const tauschKlasse =
        anzeige.tausch
          ? " tausch"
          : "";

      const tauschTag =
        anzeige.tausch
          ? `
            <span class="card-tag tausch">
              Tausch
            </span>
          `
          : "";

      const verkaeuferName =
        anzeige.ownerName ||
        anzeige.ownerEmail ||
        "Unbekannter Verkäufer";

      const verkaeuferBild =
        profilbildDesVerkaeufers(
          anzeige
        );

      const verkaeuferInitialen =
        erstelleInitialen(
          verkaeuferName
        );

      const produktbildHtml =
        anzeige.bild
          ? `
            <img
              class="card-product-image"
              src="${escapeHtml(
                anzeige.bild
              )}"
              alt="${escapeHtml(
                anzeige.title
              )}"
            >
          `
          : escapeHtml(
              kategorie.label
            );

      const verkaeuferBildHtml =
        verkaeuferBild
          ? `
            <img
              class="card-seller-image"
              src="${escapeHtml(
                verkaeuferBild
              )}"
              alt="Profilbild von ${escapeHtml(
                verkaeuferName
              )}"
            >
          `
          : `
            <span
              class="card-seller-placeholder"
            >
              ${escapeHtml(
                verkaeuferInitialen
              )}
            </span>
          `;

      return `
        <button
          class="card"
          type="button"
          data-listing-id="${escapeHtml(
            anzeige.id
          )}"
          aria-label="Anzeige ansehen: ${escapeHtml(
            anzeige.title
          )}"
        >
          <div
            class="card-media"
            style="background: ${escapeHtml(
              kategorie.color
            )}"
          >
            ${produktbildHtml}
            ${tauschTag}
          </div>

          <div class="card-body">

            <div class="card-title">
              ${escapeHtml(
                anzeige.title
              )}
            </div>

            <div
              class="card-price${tauschKlasse}"
            >
              ${escapeHtml(
                preisText(anzeige)
              )}
            </div>

            <div class="card-seller">
              ${verkaeuferBildHtml}

              <span
                class="card-seller-name"
              >
                ${escapeHtml(
                  verkaeuferName
                )}
              </span>
            </div>

            <div class="card-loc">
              <svg
                width="11"
                height="11"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                aria-hidden="true"
              >
                <path
                  d="M12 21s-7-6.2-7-11a7 7 0 1 1 14 0c0 4.8-7 11-7 11z"
                ></path>

                <circle
                  cx="12"
                  cy="10"
                  r="2.4"
                ></circle>
              </svg>

              ${escapeHtml(
                anzeige.wohnheim ||
                "Keine Angabe"
              )}
            </div>

          </div>
        </button>
      `;
    }


    // ==================================================
    // 11. ANZEIGEN FILTERN UND DARSTELLEN
    // ==================================================

    function renderAnzeigen() {
      anzeigen = ladeAnzeigen();

      const suchtext =
        searchInput.value
          .trim()
          .toLowerCase();

      const benutzer =
        ladeBenutzer();

      const gefilterteAnzeigen =
        anzeigen.filter(
          function (anzeige) {
            const titel =
              String(
                anzeige.title || ""
              ).toLowerCase();

            const passtZurSuche =
              !suchtext ||
              titel.includes(
                suchtext
              );

            const passtZurKategorie =
              !aktuelleKategorie ||
              anzeige.kategorie ===
                aktuelleKategorie;

            let passtZumBenutzer = true;

            if (nurEigeneAnzeigen) {
              if (!benutzer) {
                passtZumBenutzer =
                  false;
              } else if (
                benutzer.role ===
                "admin"
              ) {
                passtZumBenutzer =
                  true;
              } else {
                passtZumBenutzer =
                  String(
                    anzeige.ownerId
                  ) ===
                  String(
                    benutzer.id
                  );
              }
            }

            return (
              passtZurSuche &&
              passtZurKategorie &&
              passtZumBenutzer
            );
          }
        );

      const bezeichnung =
        nurEigeneAnzeigen
          ? (
              benutzer &&
              benutzer.role ===
                "admin"
                ? "verwaltbare Anzeigen"
                : "eigene Anzeigen"
            )
          : (
              gefilterteAnzeigen.length ===
              1
                ? "Ergebnis"
                : "Ergebnisse"
            );

      resultCount.innerHTML =
        "<b>" +
        gefilterteAnzeigen.length +
        "</b> " +
        bezeichnung;

      if (
        gefilterteAnzeigen.length ===
        0
      ) {
        results.innerHTML =
          nurEigeneAnzeigen
            ? `
              <div class="empty-state">
                <h3>
                  Keine eigenen Anzeigen
                </h3>

                <p>
                  Du hast bisher keine
                  Anzeige erstellt.
                </p>
              </div>
            `
            : `
              <div class="empty-state">
                <h3>
                  Keine Treffer
                </h3>

                <p>
                  Versuch es mit einem
                  anderen Suchbegriff oder
                  einer anderen Kategorie.
                </p>
              </div>
            `;

        return;
      }

      results.innerHTML = `
        <div class="grid">
          ${gefilterteAnzeigen
            .map(karteHtml)
            .join("")}
        </div>
      `;
    }


    // ==================================================
    // 12. KATEGORIE AUSWÄHLEN
    // ==================================================

    function waehleKategorie(id) {
      aktuelleKategorie = id;
      menueOffen = false;

      renderKategorien();
      renderAnzeigen();
    }


    function kategorieKlick(event) {
      const button =
        event.target.closest(
          "button[data-category]"
        );

      if (!button) {
        return;
      }

      waehleKategorie(
        button.dataset.category
      );
    }


    // ==================================================
    // 13. EVENT-LISTENER
    // ==================================================

    searchInput.addEventListener(
      "input",
      renderAnzeigen
    );


    searchForm.addEventListener(
      "submit",
      function (event) {
        event.preventDefault();
        renderAnzeigen();
      }
    );


    categoryNavigation.addEventListener(
      "click",
      kategorieKlick
    );


    burgerMenu.addEventListener(
      "click",
      kategorieKlick
    );


    burgerButton.addEventListener(
      "click",
      function () {
        menueOffen =
          !menueOffen;

        renderKategorien();
      }
    );


    logoButton.addEventListener(
      "click",
      function () {
        searchInput.value = "";
        aktuelleKategorie = "";
        nurEigeneAnzeigen = false;

        meineanzeigenButton.textContent =
          "Meine Anzeigen";

        meineanzeigenButton.classList.remove(
          "active"
        );

        renderKategorien();
        renderAnzeigen();
      }
    );


    meineanzeigenButton.addEventListener(
      "click",
      function () {
        const benutzer =
          ladeBenutzer();

        if (!benutzer) {
          window.location.href =
            "anmeldeseite_regestrierung.html";

          return;
        }

        nurEigeneAnzeigen =
          !nurEigeneAnzeigen;

        searchInput.value = "";
        aktuelleKategorie = "";

        meineanzeigenButton.textContent =
          nurEigeneAnzeigen
            ? "Alle Anzeigen"
            : "Meine Anzeigen";

        meineanzeigenButton.classList.toggle(
          "active",
          nurEigeneAnzeigen
        );

        renderKategorien();
        renderAnzeigen();
      }
    );


    sellButton.addEventListener(
      "click",
      function () {
        const benutzer =
          ladeBenutzer();

        if (!benutzer) {
          window.location.href =
            "anmeldeseite_regestrierung.html";

          return;
        }

        window.location.href =
          "verkauf.html";
      }
    );


    profileButton.addEventListener(
      "click",
      function () {
        const benutzer =
          ladeBenutzer();

        if (!benutzer) {
          window.location.href =
            "anmeldeseite_regestrierung.html";

          return;
        }

        window.location.href =
          "profil.html";
      }
    );


    results.addEventListener(
      "click",
      function (event) {
        const karte =
          event.target.closest(
            ".card[data-listing-id]"
          );

        if (!karte) {
          return;
        }

        window.location.href =
          "anzeige.html?id=" +
          encodeURIComponent(
            karte.dataset.listingId
          );
      }
    );


    // ==================================================
    // 14. SEITE STARTEN
    // ==================================================

    ladeGespeichertesTheme();
    ladeProfilbildImHeader();
    renderKategorien();
    renderAnzeigen();
  </script>
</body>
</html>
