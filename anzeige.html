  // Texte sicher in HTML einfügen
  function escapeHtml(text) {
    return String(text ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  function darfAnzeigeVerwalten(anzeige) {
  if (!loggedInUser) {
    return false;
  }

    loggedInUser.role === "admin";

  const istEigentuemer =
    String(anzeige.ownerId) ===
    String(loggedInUser.id);

  return istAdmin || istEigentuemer;
}

function loescheAnzeige(anzeige) {
  if (!darfAnzeigeVerwalten(anzeige)) {
    window.alert(
      "Du darfst diese Anzeige nicht löschen."
    );

    return;
  }

  const wirklichLoeschen = window.confirm(
    "Möchtest du diese Anzeige wirklich löschen?"
  );

  if (!wirklichLoeschen) {
    return;
  }

  const aktuelleAnzeigen = JSON.parse(
    localStorage.getItem("anzeigen")
  ) || [];

  const verbleibendeAnzeigen =
    aktuelleAnzeigen.filter(function (eintrag) {
      return String(eintrag.id) !==
        String(anzeige.id);
    });

  localStorage.setItem(
    "anzeigen",
    JSON.stringify(verbleibendeAnzeigen)
  );

  window.alert("Die Anzeige wurde gelöscht.");

  window.location.href = "index.html";
}

function findeVerkaeufer(anzeige) {
  const verkaeufer = alleBenutzer.find(

        String(anzeige.ownerId);
    }
  );

  return verkaeufer || null;
}

function formatiereZeitabstand(zeitstempel) {
  if (!zeitstempel) {
    return "Keine Angabe";
  }

  const datum = new Date(zeitstempel);

  if (Number.isNaN(datum.getTime())) {
    return "Keine Angabe";
  }

  const jetzt = new Date();

  const differenzInMillisekunden =
    jetzt.getTime() - datum.getTime();

  const differenzInMinuten = Math.floor(
    differenzInMillisekunden / 60000
  );

  const differenzInStunden = Math.floor(
    differenzInMinuten / 60
  );

  const differenzInTagen = Math.floor(
    differenzInStunden / 24
  );

  const differenzInWochen = Math.floor(
    differenzInTagen / 7
  );

  const differenzInMonaten = Math.floor(
    differenzInTagen / 30
  );

  if (differenzInMillisekunden < 0) {
    return "Gerade eben";
  }

  if (differenzInMinuten < 1) {
    return "Gerade eben";
  }

  if (differenzInMinuten === 1) {
    return "vor 1 Minute";
  }

  if (differenzInMinuten < 60) {
    return "vor " + differenzInMinuten + " Minuten";
  }

  if (differenzInStunden === 1) {
    return "vor 1 Stunde";
  }

  if (differenzInStunden < 24) {
    return "vor " + differenzInStunden + " Stunden";
  }

  if (differenzInTagen === 1) {
    return "vor 1 Tag";
  }

  if (differenzInTagen < 7) {
    return "vor " + differenzInTagen + " Tagen";
  }

  if (differenzInWochen === 1) {
    return "vor 1 Woche";
  }

  if (differenzInTagen < 30) {
    return "vor " + differenzInWochen + " Wochen";
  }

  if (differenzInMonaten === 1) {
    return "vor 1 Monat";
  }

  if (differenzInTagen < 365) {
    return "vor " + differenzInMonaten + " Monaten";
  }

  const differenzInJahren = Math.floor(
    differenzInTagen / 365
  );

  if (differenzInJahren === 1) {
    return "vor 1 Jahr";
  }

  return "vor " + differenzInJahren + " Jahren";
}

  if (!verkaeuferEmail) {
    window.alert(
      "Für diese Anzeige ist keine E-Mail-Adresse hinterlegt."
    );

    return;
  }
// Autmoatischen ausfüllen der Email, kann angepasst werden.
  const betreff =
    "Anfrage zu deiner Anzeige: " +
    anzeige.title;

  const nachricht =
    "Hallo " + verkaeuferName + ",\n\n" +
    "ich interessiere mich für deine Anzeige „" +
    anzeige.title +
    "“.\n\n" +
    "Ist die Anzeige noch verfügbar?\n\n" +
    "Viele Grüße " + loggedInUser.name;

  const mailLink =
    "mailto:" +
    encodeURIComponent(verkaeuferEmail) +
    "?subject=" +
    encodeURIComponent(betreff) +
    "&body=" +
    encodeURIComponent(nachricht);

  window.location.href = mailLink;
});

    const deleteButton =
  document.getElementById("deleteButton");

if (deleteButton) {
  deleteButton.addEventListener(
    "click",
    function () {
      loescheAnzeige(anzeige);
    }
  );
}
  }


  // ID der Anzeige aus der URL lesen
  const urlParameter =
    new URLSearchParams(window.location.search);

  const anzeigenId =
    urlParameter.get("id");


  // Passende Anzeige über ihre ID finden
  const ausgewaehlteAnzeige =
    anzeigen.find(function (anzeige) {
      return String(anzeige.id) === String(anzeigenId);
    });


  // Anzeige oder Fehlermeldung darstellen
  if (ausgewaehlteAnzeige) {
    zeigeAnzeige(ausgewaehlteAnzeige);

  function ladeGespeichertesTheme() {

    localStorage.getItem("theme");

  if (gespeichertesTheme === "dark") {
    document.body.classList.add("dark-mode");
  }
}

ladeGespeichertesTheme();
