<script>
  "use strict";

  // Anzeigen aus dem gemeinsamen localStorage laden
  let anzeigen = JSON.parse(localStorage.getItem("anzeigen")) || [];

  const registrierteBenutzer = JSON.parse(
  localStorage.getItem("registeredUsers")
) || [];

const standardBenutzer = [
  {
    id: "user-admin",
    name: "Administrator",
    email: "admin@dhbw.de"
  },
  {
    id: "user-max",
    name: "Max Mustermann",
    email: "max@dhbw.de"
  },
  {
    id: "user-lisa",
    name: "Lisa Müller",
    email: "lisa@dhbw.de"
  },
  {
    id: "user-tom",
    name: "Tom Schneider",
    email: "tom@dhbw.de"
  }
];

const alleBenutzer = [
  ...standardBenutzer,
  ...registrierteBenutzer
];

  const loggedInUser = JSON.parse(
  localStorage.getItem("loggedInUser")
);

  // Farben passend zu den Kategorie-IDs
  const kategoriefarben = {
    moebel: "#4A4A4A",
    elektronik: "#1A1A1A",
    buecher: "#7A7A7A",
    kueche: "#B40014",
    fahrrad: "#2E2E2E",
    kleidung: "#E2001A",
    sonstiges: "#5F5F5F"
  };

  // Anzeigenamen passend zu den Kategorie-IDs
  const kategorienamen = {
    moebel: "Möbel",
    elektronik: "Elektronik",
    buecher: "Bücher & Skripte",
    kueche: "Küche",
    fahrrad: "Fahrrad",
    kleidung: "Kleidung",
    sonstiges: "Sonstiges"
  };

  const mainContent =
    document.getElementById("mainContent");


  // Texte sicher in HTML einfügen
  function escapeHtml(text) {
    return String(text ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }


  // Preis lesbar darstellen
  function preisText(anzeige) {
    if (anzeige.tausch) {
      return "Zum Tausch";
    }

    const preis = Number(anzeige.price);

    if (preis === 0) {
      return "Zu verschenken";
    }

    if (!Number.isFinite(preis)) {
      return "Preis auf Anfrage";
    }

    return preis.toFixed(2).replace(".", ",") + " €";
  }


  // Lesbaren Kategorienamen bestimmen
  function kategorieName(kategorie) {
    return kategorienamen[kategorie] || kategorie || "Sonstiges";
  }


  // Passende Farbe bestimmen
  function kategorieFarbe(kategorie) {
    return kategoriefarben[kategorie] || "#5F5F5F";
  }


  // Fehler anzeigen, wenn keine passende Anzeige gefunden wurde
  function zeigeFehler() {
    mainContent.innerHTML = `
      <section class="error-message">
        <h1>Anzeige nicht gefunden</h1>

        <p>
          Die gewünschte Anzeige existiert nicht
          oder wurde entfernt.
        </p>

        <a href="index.html">
          Zurück zur Hauptseite
        </a>
      </section>
    `;
  }


  // Passende Anzeige darstellen

  function darfAnzeigeVerwalten(anzeige) {
  if (!loggedInUser) {
    return false;
  }

  const istAdmin =
    loggedInUser.role === "admin";

  const istEigentuemer =
    String(anzeige.ownerId) ===
    String(loggedInUser.id);

  return istAdmin || istEigentuemer;
}

function loescheAnzeige(anzeige) {
  if (!darfAnzeigeVerwalten(anzeige)) {
    window.alert(
      "Du darfst diese Anzeige nicht löschen."
    );

    return;
  }

  const wirklichLoeschen = window.confirm(
    "Möchtest du diese Anzeige wirklich löschen?"
  );

  if (!wirklichLoeschen) {
    return;
  }

  window.DHBWMarktData.deleteListing(anzeige.id).then(function () {
    window.alert("Die Anzeige wurde gelöscht.");
    window.location.href = "index.html";
  }).catch(function (error) {
    console.error(error);
    window.alert("Die Anzeige konnte nicht gelöscht werden: " + (error.message || error));
  });
}

function findeVerkaeufer(anzeige) {
  const verkaeufer = alleBenutzer.find(
    function (benutzer) {
      return String(benutzer.id) ===
        String(anzeige.ownerId);
    }
  );

  return verkaeufer || null;
}

function formatiereZeitabstand(zeitstempel) {
  if (!zeitstempel) {
    return "Keine Angabe";
  }

  const datum = new Date(zeitstempel);

  if (Number.isNaN(datum.getTime())) {
    return "Keine Angabe";
  }

  const jetzt = new Date();

  const differenzInMillisekunden =
    jetzt.getTime() - datum.getTime();

  const differenzInMinuten = Math.floor(
    differenzInMillisekunden / 60000
  );

  const differenzInStunden = Math.floor(
    differenzInMinuten / 60
  );

  const differenzInTagen = Math.floor(
    differenzInStunden / 24
  );

  const differenzInWochen = Math.floor(
    differenzInTagen / 7
  );

  const differenzInMonaten = Math.floor(
    differenzInTagen / 30
  );

  if (differenzInMillisekunden < 0) {
    return "Gerade eben";
  }

  if (differenzInMinuten < 1) {
    return "Gerade eben";
  }

  if (differenzInMinuten === 1) {
    return "vor 1 Minute";
  }

  if (differenzInMinuten < 60) {
    return "vor " + differenzInMinuten + " Minuten";
  }

  if (differenzInStunden === 1) {
    return "vor 1 Stunde";
  }

  if (differenzInStunden < 24) {
    return "vor " + differenzInStunden + " Stunden";
  }

  if (differenzInTagen === 1) {
    return "vor 1 Tag";
  }

  if (differenzInTagen < 7) {
    return "vor " + differenzInTagen + " Tagen";
  }

  if (differenzInWochen === 1) {
    return "vor 1 Woche";
  }

  if (differenzInTagen < 30) {
    return "vor " + differenzInWochen + " Wochen";
  }

  if (differenzInMonaten === 1) {
    return "vor 1 Monat";
  }

  if (differenzInTagen < 365) {
    return "vor " + differenzInMonaten + " Monaten";
  }

  const differenzInJahren = Math.floor(
    differenzInTagen / 365
  );

  if (differenzInJahren === 1) {
    return "vor 1 Jahr";
  }

  return "vor " + differenzInJahren + " Jahren";
}

function favoritenKey() {
  return loggedInUser
    ? "favoriten-" + loggedInUser.id
    : null;
}

function ladeFavoriten() {
  const key = favoritenKey();

  if (!key) {
    return [];
  }

  try {
    const liste = JSON.parse(localStorage.getItem(key));
    return Array.isArray(liste) ? liste : [];
  } catch (fehler) {
    return [];
  }
}

function wechsleFavorit(id) {
  const key = favoritenKey();
  if (!key) {
    window.location.href = "anmeldeseite_regestrierung.html";
    return false;
  }

  const idText = String(id);
  let liste = ladeFavoriten();

  if (liste.includes(idText)) {
    liste = liste.filter(function (eintrag) {
      return String(eintrag) !== idText;
    });
  } else {
    liste.push(idText);
  }

  const istFavorit = liste.includes(idText);
  // Sofort lokal aktualisieren, damit das Herz direkt reagiert.
  localStorage.setItem(key, JSON.stringify(liste));

  // Supabase im Hintergrund synchronisieren; bei Fehler Cache/UI zurücksetzen.
  window.DHBWMarktData.setFavorite(idText, istFavorit).catch(function (error) {
    console.error("Favorit konnte nicht in Supabase gespeichert werden:", error);
    window.alert("Favorit konnte nicht gespeichert werden: " + (error.message || error));
    window.DHBWMarktData.getFavorites().then(function (favoriten) {
      localStorage.setItem(key, JSON.stringify(favoriten.map(String)));
      document.querySelectorAll(".detail-fav").forEach(function (button) {
        const aktiv = favoriten.map(String).includes(idText);
        button.classList.toggle("active", aktiv);
        button.setAttribute("aria-pressed", String(aktiv));
      });
    }).catch(function (syncError) {
      console.error("Favoriten konnten nicht erneut geladen werden:", syncError);
    });
  });

  return istFavorit;
}

function ladeBewertungen() {
  try {
    const liste = JSON.parse(localStorage.getItem("bewertungen"));
    return Array.isArray(liste) ? liste : [];
  } catch (fehler) {
    return [];
  }
}

function speichereBewertungen(liste) {
  localStorage.setItem("bewertungen", JSON.stringify(liste));
}

function bewertungenFuer(verkaeuferId) {
  return ladeBewertungen().filter(function (b) {
    return String(b.verkaeuferId) === String(verkaeuferId);
  });
}

function durchschnittVon(liste) {
  if (!liste.length) return 0;
  const summe = liste.reduce(function (s, b) { return s + Number(b.sterne); }, 0);
  return summe / liste.length;
}

function sterneText(wert) {
  const voll = Math.round(wert);
  return "★".repeat(voll) + "☆".repeat(5 - voll);
}

function renderBewertungen(anzeige) {
  const box = document.getElementById("ratingBox");
  const summary = document.getElementById("sellerRatingSummary");

  if (!box) return;

  if (!anzeige.ownerId) {
    box.hidden = true;
    return;
  }

  const verkaeuferId = String(anzeige.ownerId);

  const liste = bewertungenFuer(verkaeuferId).sort(function (a, b) {
    return new Date(b.erstelltAm) - new Date(a.erstelltAm);
  });

  const schnitt = durchschnittVon(liste);
  const schnittText = schnitt.toFixed(1).replace(".", ",");

  // Kurzfassung neben dem Verkäufernamen
  if (summary) {
    summary.innerHTML = liste.length
      ? '<span class="stars">' + sterneText(schnitt) + "</span> " +
        schnittText + " (" + liste.length + ")"
      : "Noch keine Bewertungen";
  }

  const istEigener =
    loggedInUser && String(loggedInUser.id) === verkaeuferId;

  const meine = loggedInUser
    ? liste.find(function (b) {
        return String(b.bewerterId) === String(loggedInUser.id);
      })
    : null;

  let formHtml = "";

  if (!loggedInUser) {
    formHtml =
      '<p class="rating-note"><a href="anmeldeseite_regestrierung.html">Melde dich an</a>, um diesen Verkäufer zu bewerten.</p>';
  } else if (istEigener) {
    formHtml = '<p class="rating-note">Du kannst dich nicht selbst bewerten.</p>';
  } else if (meine) {
    formHtml = '<p class="rating-note">Du hast diesen Verkäufer bereits bewertet. Bewertungen können nicht geändert werden.</p>';
  } else {
    formHtml = `
      <form class="rating-form" id="ratingForm">
        <div class="star-input" id="starInput">
          ${[1, 2, 3, 4, 5].map(function (n) {
            return '<button type="button" data-stern="' + n +
              '" aria-label="' + n + ' Sterne">★</button>';
          }).join("")}
        </div>
        <textarea id="ratingComment" maxlength="300"
          placeholder="Optionaler Kommentar (max. 300 Zeichen)"></textarea>
        <button class="rating-submit" type="submit">Bewertung abgeben</button>
      </form>
    `;
  }

  const listeHtml = liste.length
    ? '<ul class="rating-list">' + liste.map(function (b) {
        const darfLoeschen =
          loggedInUser &&
          (loggedInUser.role === "admin" ||
            String(loggedInUser.id) === String(b.bewerterId));

        return `
          <li class="rating-item">
            <div class="rating-item-head">
              <span>
                <strong>${escapeHtml(b.bewerterName || "Unbekannt")}</strong>
                <span class="stars">${sterneText(b.sterne)}</span>
              </span>
              ${darfLoeschen
                ? '<button class="rating-delete" type="button" data-delete-rating="' +
                  escapeHtml(b.id) + '">Löschen</button>'
                : ""}
            </div>
            ${b.kommentar ? "<p>" + escapeHtml(b.kommentar) + "</p>" : ""}
          </li>
        `;
      }).join("") + "</ul>"
    : "";

  box.innerHTML = `
    <h2>Bewertungen für ${escapeHtml(anzeige.ownerName || "Verkäufer")}</h2>
    <p class="rating-note">
      ${liste.length
        ? '<span class="stars">' + sterneText(schnitt) + "</span> " +
          schnittText + " von 5 (" + liste.length + " Bewertung" +
          (liste.length === 1 ? "" : "en") + ")"
        : "Noch keine Bewertungen vorhanden."}
    </p>
    ${formHtml}
    ${listeHtml}
  `;

  // Sterne-Auswahl und Formular
  const form = document.getElementById("ratingForm");

  if (form) {
    let gewaehlt = meine ? Number(meine.sterne) : 0;
    const sterne = form.querySelectorAll("[data-stern]");
    const kommentarFeld = document.getElementById("ratingComment");

    if (meine) kommentarFeld.value = meine.kommentar || "";

    function zeigeSterne() {
      sterne.forEach(function (button) {
        button.classList.toggle("on", Number(button.dataset.stern) <= gewaehlt);
      });
    }

    sterne.forEach(function (button) {
      button.addEventListener("click", function () {
        gewaehlt = Number(button.dataset.stern);
        zeigeSterne();
      });
    });

    zeigeSterne();

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      if (gewaehlt < 1) {
        window.alert("Bitte wähle mindestens einen Stern aus.");
        return;
      }

      const alle = ladeBewertungen();

      const index = alle.findIndex(function (b) {
        return String(b.verkaeuferId) === verkaeuferId &&
          String(b.bewerterId) === String(loggedInUser.id);
      });

      const eintrag = {
        id: index !== -1 ? alle[index].id : "bew-" + Date.now(),
        verkaeuferId: verkaeuferId,
        bewerterId: loggedInUser.id,
        bewerterName: loggedInUser.name || loggedInUser.email,
        sterne: gewaehlt,
        kommentar: kommentarFeld.value.trim(),
        erstelltAm: new Date().toISOString()
      };

      if (index !== -1) {
        alle[index] = eintrag;
      } else {
        alle.push(eintrag);
      }

      speichereBewertungen(alle);
      window.DHBWMarktData.saveReview({
        fuerId: verkaeuferId,
        anzeigeId: anzeige.id,
        sterne: gewaehlt,
        kommentar: kommentarFeld.value.trim()
      }).then(async function (savedId) {
        const savedReviews = ladeBewertungen();
        const savedReview = savedReviews.find(function (b) {
          return String(b.verkaeuferId) === verkaeuferId &&
            String(b.bewerterId) === String(loggedInUser.id);
        });
        if (savedReview && savedId) {
          savedReview.id = savedId;
          speichereBewertungen(savedReviews);
        }
        await window.DHBWMarktData.bootstrapCache();
        renderBewertungen(anzeige);
      }).catch(function (error) {
        console.error(error);
        window.alert("Bewertung konnte nicht gespeichert werden: " + (error.message || error));
      });
    });
  }

  // Bewertung löschen
  box.querySelectorAll("[data-delete-rating]").forEach(function (button) {
    button.addEventListener("click", function () {
      if (!window.confirm("Bewertung wirklich löschen?")) return;

      button.disabled = true;
      button.textContent = "Wird gelöscht …";

      window.DHBWMarktData.deleteReview(
        button.dataset.deleteRating,
        Boolean(loggedInUser && loggedInUser.role === "admin")
      )
        .then(function () {
          const verbleibend = ladeBewertungen().filter(function (b) {
            return String(b.id) !== String(button.dataset.deleteRating);
          });
          speichereBewertungen(verbleibend);
          renderBewertungen(anzeige);
        })
        .catch(function (error) {
          console.error("Bewertung konnte nicht gelöscht werden:", error);
          window.alert("Bewertung konnte nicht gelöscht werden: " + (error.message || error));
          button.disabled = false;
          button.textContent = "Löschen";
        });
    });
  });
}

  // Die Detailseite lädt zuerst gezielt die Anzeige aus Supabase.
  // bootstrapCache lädt zusätzlich Favoriten/Nachrichten/Bewertungen und kann
  // fehlschlagen, obwohl die Anzeige selbst erreichbar ist.
  (async function ladeGemeinsameAnzeige() {
    let aktuelleAnzeige = null;
    let cacheAnzeigen = [];

    try {
      cacheAnzeigen = JSON.parse(localStorage.getItem("anzeigen")) || [];
    } catch (_) {
      cacheAnzeigen = [];
    }

    // Erst direkt per UUID laden – unabhängig davon, ob der übrige Cache-Aufbau klappt.
    if (anzeigenId) {
      try {
        const direktGeladen = await window.DHBWMarktData.getListings({
          id: anzeigenId,
          includeArchived: true
        });
        aktuelleAnzeige = direktGeladen.find(function (a) {
          return String(a.id) === String(anzeigenId);
        }) || null;
      } catch (error) {
        console.error("Anzeige konnte nicht direkt aus Supabase geladen werden:", error);
      }
    }

    // Falls direkter Abruf nicht geklappt hat, Cache aktualisieren und erneut prüfen.
    if (!aktuelleAnzeige) {
      try {
        await window.DHBWMarktData.bootstrapCache();
      } catch (error) {
        console.error("Der übrige Supabase-Cache konnte nicht geladen werden:", error);
      }

      try {
        cacheAnzeigen = JSON.parse(localStorage.getItem("anzeigen")) || [];
      } catch (_) {
        cacheAnzeigen = [];
      }
      aktuelleAnzeige = cacheAnzeigen.find(function (a) {
        return String(a.id) === String(anzeigenId);
      }) || null;
    }

    if (aktuelleAnzeige) {
      const rest = cacheAnzeigen.filter(function (a) {
        return String(a.id) !== String(aktuelleAnzeige.id);
      });
      localStorage.setItem("anzeigen", JSON.stringify([aktuelleAnzeige].concat(rest)));

          );

          console.warn("Favoriten konnten nicht aus Supabase synchronisiert werden; verwende den lokalen Cache.", error);
        }
      }

      zeigeAnzeige(aktuelleAnzeige);
    } else {
      zeigeFehler();
    }
  })();
