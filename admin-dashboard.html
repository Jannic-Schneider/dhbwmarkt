<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin-Dashboard | dhbwmarkt</title>

  <style>
    :root {
      --red: #e2001a;
      --red-dark: #b40014;
      --ink: #1a1a1a;
      --ink-soft: #5f5f5f;
      --bg: #ffffff;
      --bg-alt: #f5f5f5;
      --border: #dedede;
      --border-strong: #c7c7c7;
    }

    body.dark-mode {
      --ink: #f5f5f5;
      --ink-soft: #b8b8b8;
      --bg: #1b1b1b;
      --bg-alt: #101010;
      --border: #444444;
      --border-strong: #555555;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      color: var(--ink);
      background: var(--bg-alt);
      font-family: Arial, Helvetica, sans-serif;
    }

    button, input, select { font: inherit; }
    a { color: var(--red); text-decoration: none; }
    :focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

    /* Header / Footer */
    .header {
      padding: 16px 20px;
      background: var(--bg);
      border-bottom: 3px solid var(--red);
    }

    .header-content, .footer-content {
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo { color: var(--ink); font-size: 26px; font-weight: 900; }
    .logo-red { color: var(--red); }
    .back-link { font-size: 14px; font-weight: 700; }
    .back-link:hover { text-decoration: underline; }

    .footer { padding: 20px; color: #fff; background: var(--red); font-size: 14px; }
    .footer a { color: #fff; font-weight: 700; }

    /* Layout */
    .main {
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
      padding: 36px 20px 70px;
      flex: 1;
    }

    .page-title { margin: 0 0 6px; font-size: 30px; }
    .page-intro { margin: 0 0 24px; color: var(--ink-soft); }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 22px;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }

    .tab {
      padding: 11px 18px;
      color: var(--ink-soft);
      background: none;
      border: 0;
      border-bottom: 3px solid transparent;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
    }

    .tab:hover { color: var(--red); }
    .tab.active { color: var(--red); border-bottom-color: var(--red); }

    /* Benutzerverwaltung vollständig aus der Oberfläche ausblenden – ohne Aufblitzen beim Laden. */
    .tab[data-tab="benutzer"] { display: none !important; }

    .panel[hidden] { display: none; }

    /* Statistik-Karten */
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 14px;
      margin-bottom: 22px;
    }

    .stat {
      padding: 18px 20px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-top: 4px solid var(--red);
      border-radius: 8px;
    }

    .stat-value { font-size: 32px; font-weight: 900; line-height: 1.1; }
    .stat-label { margin-top: 6px; color: var(--ink-soft); font-size: 13px; }

    /* Boxen */
    .box {
      padding: 22px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .box h2 { margin: 0 0 16px; font-size: 18px; }

    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    /* Balkendiagramm */
    .bar-row {
      display: grid;
      grid-template-columns: 130px 1fr 34px;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      font-size: 13px;
    }

    .bar-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .bar-track {
      height: 12px;
      overflow: hidden;
      background: var(--bg-alt);
      border-radius: 6px;
    }

    .bar-fill {
      height: 100%;
      min-width: 2px;
      background: var(--red);
      border-radius: 6px;
      transition: width 0.3s ease;
    }

    .bar-count { text-align: right; font-weight: 700; }

    .empty { margin: 0; color: var(--ink-soft); font-size: 14px; }

    /* Kuchendiagramm */
    .pie-wrap {
      display: flex;
      align-items: center;
      gap: 22px;
      flex-wrap: wrap;
    }

    .pie-svg {
      width: 190px;
      height: 190px;
      flex-shrink: 0;
    }

    .pie-slice, .pie-svg circle {
      stroke: var(--bg);
      stroke-width: 2;
    }

    .pie-slice:hover { opacity: 0.85; }

    .pie-legend {
      flex: 1;
      min-width: 180px;
      margin: 0;
      padding: 0;
      list-style: none;
      font-size: 13px;
    }

    .pie-legend li {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 0;
    }

    .pie-dot {
      width: 12px;
      height: 12px;
      flex-shrink: 0;
      border-radius: 3px;
      border: 1px solid var(--border);
    }

    .pie-name {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .pie-value { font-weight: 700; white-space: nowrap; }

    /* Werkzeugleiste */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .toolbar input, .toolbar select {
      padding: 10px 12px;
      color: var(--ink);
      background: var(--bg);
      border: 1px solid var(--border-strong);
      border-radius: 5px;
      font-size: 14px;
    }

    .toolbar input[type="search"] { flex: 1; min-width: 180px; }
    .toolbar .count { margin-left: auto; color: var(--ink-soft); font-size: 13px; }

    /* Tabellen */
    .table-wrap {
      overflow-x: auto;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    table { width: 100%; border-collapse: collapse; font-size: 14px; }

    th, td {
      padding: 12px 14px;
      text-align: left;
      vertical-align: middle;
      border-bottom: 1px solid var(--border);
    }

    th {
      color: var(--ink-soft);
      font-size: 12px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    tr:last-child td { border-bottom: 0; }

    .cell-user { display: flex; align-items: center; gap: 10px; min-width: 190px; }

    .avatar, .thumb {
      flex-shrink: 0;
      overflow: hidden;
      color: #fff;
      background: var(--red);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
    }

    .avatar { width: 36px; height: 36px; border-radius: 50%; font-size: 13px; }
    .thumb { width: 48px; height: 48px; border-radius: 4px; font-size: 10px; text-align: center; background: var(--ink-soft); }
    .avatar img, .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .title-cell { max-width: 260px; min-width: 180px; font-weight: 700; overflow-wrap: anywhere; }
    .muted { color: var(--ink-soft); font-size: 12px; font-weight: 400; }

    .badge {
      display: inline-block;
      padding: 3px 8px;
      color: #fff;
      background: var(--ink-soft);
      border-radius: 3px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .badge.admin, .badge.tausch { background: var(--red); }

    /* Buttons */
    .actions { display: flex; gap: 6px; flex-wrap: wrap; }

    .btn {
      padding: 7px 13px;
      color: var(--ink);
      background: var(--bg-alt);
      border: 1px solid var(--border);
      border-radius: 18px;
      font-size: 12.5px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
    }

    .btn:hover { color: var(--red); border-color: var(--red); }

    .btn.danger { color: #fff; background: var(--red); border-color: var(--red); }
    .btn.danger:hover { background: var(--red-dark); border-color: var(--red-dark); color: #fff; }

    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn:disabled:hover { color: var(--ink); border-color: var(--border); }

    .table-empty { padding: 36px 20px; color: var(--ink-soft); text-align: center; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%) translateY(10px);
      padding: 12px 20px;
      color: #fff;
      background: #1a1a1a;
      border-left: 4px solid var(--red);
      border-radius: 22px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 100;
    }

    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* Benutzer-Dialog */
    .modal-overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(0, 0, 0, 0.55);
      z-index: 90;
    }

    .modal-overlay.open { display: flex; }

    .modal {
      width: 100%;
      max-width: 560px;
      max-height: 92vh;
      overflow-y: auto;
      padding: 24px;
      background: var(--bg);
      border-top: 4px solid var(--red);
      border-radius: 8px;
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .modal-head h2 { margin: 0; font-size: 20px; }

    .modal-close {
      padding: 4px 8px;
      color: var(--ink-soft);
      background: none;
      border: 0;
      font-size: 18px;
      cursor: pointer;
    }

    .modal-close:hover { color: var(--red); }

    .form-group { margin-bottom: 15px; }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 700;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 10px 12px;
      color: var(--ink);
      background: var(--bg);
      border: 1px solid var(--border-strong);
      border-radius: 5px;
      font-size: 14px;
    }

    .form-group input:disabled, .form-group select:disabled {
      color: var(--ink-soft);
      background: var(--bg-alt);
    }

    .form-group input[readonly] { background: var(--bg-alt); color: var(--ink-soft); }

    .input-row { display: flex; gap: 8px; }
    .input-row input { flex: 1; min-width: 0; }

    .code-field { font-family: "Courier New", monospace; letter-spacing: 1px; }

    .modal-note { margin: 0 0 14px; color: var(--ink-soft); font-size: 12.5px; line-height: 1.45; }

    .modal-status { min-height: 18px; margin: 4px 0 0; color: var(--red); font-size: 13px; }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    @media (max-width: 800px) {
      .two-col { grid-template-columns: 1fr; }
    }

    @media (max-width: 560px) {
      .header-content, .footer-content { flex-direction: column; align-items: flex-start; }
      .main { padding: 26px 12px 50px; }
      .bar-row { grid-template-columns: 100px 1fr 30px; }
    }
  
    
    /* Einheitlicher Footer auf allen Seiten: drei Elemente als eine mittige Gruppe */
    .footer-content { width:100%; max-width:1180px; margin:0 auto; display:flex; justify-content:center; align-items:center; }
    .footer-links { display:flex; justify-content:center; align-items:center; gap:18px; flex-wrap:wrap; }
    .footer-links a, .footer-links .footer-current, .footer-links .footer-copyright { color:#fff; font-weight:700; text-decoration:none; white-space:nowrap; }
    .footer-links a:hover { text-decoration:underline; }
    @media (max-width:600px) { .footer-content { justify-content:center; } .footer-links { gap:12px; } }

</style>
</head>

<body>
  <header class="header">
    <div class="header-content">
      <a class="logo" href="index.html"><span class="logo-red">dhbw</span>markt</a>
      <a class="back-link" href="Profil.html">Zurück zum Profil</a>
    </div>
  </header>

  <main class="main" id="mainContent" hidden>
    <h1 class="page-title">Admin-Dashboard</h1>
    <p class="page-intro">Benutzer und Anzeigen im Überblick verwalten.</p>

    <nav class="tabs" role="tablist">
      <button class="tab active" type="button" data-tab="uebersicht" role="tab">Übersicht</button>
      <button class="tab" type="button" data-tab="benutzer" role="tab">Benutzer</button>
      <button class="tab" type="button" data-tab="anzeigen" role="tab">Anzeigen</button>
    </nav>

    <!-- ÜBERSICHT -->
    <section class="panel" id="panel-uebersicht">
      <div class="stats" id="stats"></div>

      <div class="two-col">
        <div class="box">
          <h2>Anzeigen nach Kategorie</h2>
          <div id="chartKategorien"></div>
        </div>

        <div class="box">
          <h2>Anzeigen nach Wohnheim</h2>
          <div id="chartWohnheime"></div>
        </div>
      </div>
    </section>

    <!-- BENUTZER -->
    <section class="panel" id="panel-benutzer" hidden>
      <div class="toolbar">
        <input type="search" id="userSearch" placeholder="Name oder E-Mail suchen …" aria-label="Benutzer suchen">
        <span class="count" id="userCount"></span>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Benutzer</th>
              <th>E-Mail</th>
              <th>Wohnheim</th>
              <th>Anzeigen</th>
              <th>Rolle</th>
              <th>Aktionen</th>
            </tr>
          </thead>
          <tbody id="userBody"></tbody>
        </table>
      </div>
    </section>

    <!-- ANZEIGEN -->
    <section class="panel" id="panel-anzeigen" hidden>
      <div class="toolbar">
        <input type="search" id="adSearch" placeholder="Titel oder Verkäufer suchen …" aria-label="Anzeigen suchen">
        <select id="adCategory" aria-label="Kategorie filtern">
          <option value="">Alle Kategorien</option>
        </select>
        <select id="adType" aria-label="Angebotsart filtern">
          <option value="">Verkauf &amp; Tausch</option>
          <option value="verkauf">Nur Verkauf</option>
          <option value="tausch">Nur Tausch</option>
        </select>
        <span class="count" id="adCount"></span>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Anzeige</th>
              <th>Kategorie</th>
              <th>Preis</th>
              <th>Verkäufer</th>
              <th>Erstellt</th>
              <th>Aktionen</th>
            </tr>
          </thead>
          <tbody id="adBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-content">
      <div class="footer-links">
        <span class="footer-copyright">&copy; 2026 dhbwmarkt</span>
        <a href="impressum.html">Impressum</a>
        <a href="datenschutz.html">Datenschutz</a>
      </div>
    </div>
  </footer>

  <!-- Benutzer-Dialog -->
  <div class="modal-overlay" id="userModal">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="userModalTitle">
      <div class="modal-head">
        <h2 id="userModalTitle">Benutzerdaten</h2>
        <button class="modal-close" id="userModalClose" type="button" aria-label="Schließen">✕</button>
      </div>

      <p class="modal-note" id="userModalNote" hidden></p>

      <form id="userForm">
        <div class="form-group">
          <label for="uId">Benutzer-ID</label>
          <input id="uId" type="text" readonly>
        </div>

        <div class="form-group">
          <label for="uName">Name</label>
          <input id="uName" type="text" minlength="2" required>
        </div>

        <div class="form-group">
          <label for="uEmail">E-Mail-Adresse</label>
          <input id="uEmail" type="email" required>
        </div>

        <div class="form-group">
          <label for="uWohnheim">Wohnheim / Standort</label>
          <select id="uWohnheim"></select>
        </div>

        <div class="form-group">
          <label for="uPassword">Passwort</label>
          <div class="input-row">
            <input id="uPassword" type="password" minlength="6" autocomplete="off" required>
            <button class="btn" id="uTogglePw" type="button">Anzeigen</button>
          </div>
        </div>

        <div class="form-group">
          <label for="uRole">Rolle</label>
          <select id="uRole">
            <option value="user">Normaler Benutzer</option>
            <option value="admin">Administrator</option>
          </select>
        </div>

        <div class="form-group">
          <label for="uCode">Wiederherstellungscode</label>
          <div class="input-row">
            <input id="uCode" class="code-field" type="text" readonly>
            <button class="btn" id="uNewCode" type="button">Neu erzeugen</button>
          </div>
        </div>

        <p class="modal-status" id="userModalStatus" aria-live="polite"></p>

        <div class="modal-footer">
          <button class="btn" id="userModalCancel" type="button">Abbrechen</button>
          <button class="btn danger" id="userModalSave" type="submit">Speichern</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="supabase-data.js"></script>
<script>
    "use strict";

    // ==================================================
    // 1. THEME
    // ==================================================

    function istNacht() {
      const test = localStorage.getItem("testNacht");
      if (test === "an") return true;
      if (test === "aus") return false;
      const stunde = new Date().getHours();
      return stunde >= 20 || stunde < 7;
    }

    function ladeGespeichertesTheme() {
      const auto = localStorage.getItem("autoTheme") === "on";
      const dunkel = auto ? istNacht() : localStorage.getItem("theme") === "dark";
      document.body.classList.toggle("dark-mode", dunkel);
    }

    ladeGespeichertesTheme();


    // ==================================================
    // 2. DATEN
    // ==================================================

    const KATEGORIEN = {
      moebel: "Möbel",
      elektronik: "Elektronik",
      buecher: "Bücher & Skripte",
      kueche: "Küche",
      fahrrad: "Fahrrad",
      kleidung: "Kleidung",
      sonstiges: "Sonstiges"
    };

    // Entspricht dem fest eingebauten Admin aus der Anmeldeseite
    const STANDARD_ADMIN = {
      id: "admin",
      name: "Admin",
      email: "admin@dhbw.de",
      wohnheim: "Kein Wohnheim / außerhalb eines Wohnheims",
      role: "admin"
    };

    function leseJson(key, fallback) {
      try {
        const wert = JSON.parse(localStorage.getItem(key));
        return wert === null || wert === undefined ? fallback : wert;
      } catch (fehler) {
        console.error(key + " konnte nicht gelesen werden:", fehler);
        return fallback;
      }
    }

    const admin = leseJson("loggedInUser", null);

    function ladeBenutzer() {
      const registrierte = leseJson("registeredUsers", []);
      return [STANDARD_ADMIN].concat(registrierte);
    }

    function ladeAnzeigen() {
      return leseJson("anzeigen", []);
    }

    function profilbild(benutzer) {
      return benutzer.profileImage ||
        localStorage.getItem("profileImage-" + benutzer.id) || "";
    }

    function zaehleFavoriten() {
      let summe = 0;
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key && key.indexOf("favoriten-") === 0) {
          const liste = leseJson(key, []);
          if (Array.isArray(liste)) summe += liste.length;
        }
      }
      return summe;
    }


    // ==================================================
    // 3. HILFSFUNKTIONEN
    // ==================================================

    function escapeHtml(text) {
      return String(text ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function initialen(name) {
      const teile = String(name || "").trim().split(/\s+/).filter(Boolean);
      if (!teile.length) return "?";
      return teile.slice(0, 2).map(function (t) { return t.charAt(0).toUpperCase(); }).join("");
    }

    function preisText(anzeige) {
      if (anzeige.tausch) return "Tausch";
      const preis = Number(anzeige.price);
      if (!Number.isFinite(preis)) return "Auf Anfrage";
      if (preis === 0) return "Verschenken";
      return preis.toFixed(2).replace(".", ",") + " €";
    }

    function datumText(iso) {
      if (!iso) return "–";
      const datum = new Date(iso);
      if (Number.isNaN(datum.getTime())) return "–";
      return datum.toLocaleDateString("de-DE", {
        day: "2-digit", month: "2-digit", year: "numeric"
      });
    }

    let toastTimer = null;
    function zeigeToast(text) {
      const toast = document.getElementById("toast");
      toast.textContent = text;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toast.classList.remove("show"); }, 2600);
    }

    function speichere(key, wert) {
      try {
        localStorage.setItem(key, JSON.stringify(wert));
        return true;
      } catch (fehler) {
        console.error("Speichern fehlgeschlagen:", fehler);
        window.alert("Die Änderung konnte nicht gespeichert werden.");
        return false;
      }
    }


    // ==================================================
    // 4. ZUGRIFFSSCHUTZ
    // ==================================================

    if (!admin) {
      window.location.href = "anmeldeseite_regestrierung.html";
    } else if (admin.role !== "admin") {
      window.alert("Du hast keine Berechtigung für das Admin-Dashboard.");
      window.location.href = "index.html";
    } else {
      document.getElementById("mainContent").hidden = false;
    }


    // ==================================================
    // 5. ÜBERSICHT
    // ==================================================

    let echteBenutzerAnzahl = null;

    function renderStats() {
      const benutzerAnzahl = Number.isInteger(echteBenutzerAnzahl)
        ? echteBenutzerAnzahl
        : ladeBenutzer().length;
      const anzeigen = ladeAnzeigen();

      const tausch = anzeigen.filter(function (a) { return a.tausch; }).length;
      const verkauf = anzeigen.length - tausch;

      const gestern = Date.now() - 24 * 60 * 60 * 1000;
      const neu = anzeigen.filter(function (a) {
        const zeit = new Date(a.erstelltAm).getTime();
        return Number.isFinite(zeit) && zeit >= gestern;
      }).length;

      const werte = [
        [benutzerAnzahl, "Benutzer"],
        [anzeigen.length, "Anzeigen gesamt"],
        [verkauf, "Zum Verkauf"],
        [tausch, "Zum Tausch"],
        [neu, "Neu (letzte 24 h)"],
        [zaehleFavoriten(), "Favoriten gesamt"]
      ];

      document.getElementById("stats").innerHTML = werte.map(function (eintrag) {
        return '<div class="stat"><div class="stat-value">' + eintrag[0] +
          '</div><div class="stat-label">' + escapeHtml(eintrag[1]) + "</div></div>";
      }).join("");
    }

    const KUCHEN_FARBEN = [
      "#e2001a", "#1a1a1a", "#7a7a7a", "#b40014", "#f2828f",
      "#4a4a4a", "#ff6b3d", "#c7c7c7", "#8c0010", "#2e6f95"
    ];

    function kuchenHtml(eintraege) {
      const daten = eintraege.filter(function (e) { return e[1] > 0; });
      const summe = daten.reduce(function (s, e) { return s + e[1]; }, 0);

      if (!summe) {
        return '<p class="empty">Noch keine Daten vorhanden.</p>';
      }

      const mitte = 100;
      const radius = 92;
      let winkel = -Math.PI / 2;
      let scheiben = "";

      daten.forEach(function (eintrag, i) {
        const farbe = KUCHEN_FARBEN[i % KUCHEN_FARBEN.length];
        const anteil = eintrag[1] / summe;
        const titel = "<title>" + escapeHtml(eintrag[0]) + ": " + eintrag[1] + "</title>";

        if (daten.length === 1) {
          scheiben += '<circle cx="' + mitte + '" cy="' + mitte + '" r="' + radius +
            '" fill="' + farbe + '">' + titel + "</circle>";
          return;
        }

        const ende = winkel + anteil * 2 * Math.PI;
        const x1 = mitte + radius * Math.cos(winkel);
        const y1 = mitte + radius * Math.sin(winkel);
        const x2 = mitte + radius * Math.cos(ende);
        const y2 = mitte + radius * Math.sin(ende);
        const gross = anteil > 0.5 ? 1 : 0;

        scheiben += '<path d="M' + mitte + " " + mitte + " L" + x1.toFixed(2) + " " + y1.toFixed(2) +
          " A" + radius + " " + radius + " 0 " + gross + " 1 " + x2.toFixed(2) + " " + y2.toFixed(2) +
          ' Z" fill="' + farbe + '" class="pie-slice">' + titel + "</path>";

        winkel = ende;
      });

      const legende = daten.map(function (eintrag, i) {
        const prozent = Math.round((eintrag[1] / summe) * 100);
        return '<li><span class="pie-dot" style="background:' + KUCHEN_FARBEN[i % KUCHEN_FARBEN.length] + '"></span>' +
          '<span class="pie-name" title="' + escapeHtml(eintrag[0]) + '">' + escapeHtml(eintrag[0]) + "</span>" +
          '<span class="pie-value">' + eintrag[1] + " (" + prozent + " %)</span></li>";
      }).join("");

      return '<div class="pie-wrap">' +
        '<svg class="pie-svg" viewBox="0 0 200 200" role="img" aria-label="Kuchendiagramm">' + scheiben + "</svg>" +
        '<ul class="pie-legend">' + legende + "</ul></div>";
    }

    function renderCharts() {
      const anzeigen = ladeAnzeigen();

      const proKategorie = {};
      Object.keys(KATEGORIEN).forEach(function (id) { proKategorie[id] = 0; });
      anzeigen.forEach(function (a) {
        const id = KATEGORIEN[a.kategorie] ? a.kategorie : "sonstiges";
        proKategorie[id] += 1;
      });

      const kategorieDaten = Object.keys(proKategorie)
        .map(function (id) { return [KATEGORIEN[id], proKategorie[id]]; })
        .sort(function (a, b) { return b[1] - a[1]; });

      const proWohnheim = {};
      anzeigen.forEach(function (a) {
        const name = String(a.wohnheim || "Keine Angabe").split(" – ")[0];
        proWohnheim[name] = (proWohnheim[name] || 0) + 1;
      });

      const wohnheimDaten = Object.keys(proWohnheim)
        .map(function (name) { return [name, proWohnheim[name]]; })
        .sort(function (a, b) { return b[1] - a[1]; })
        .reduce(function (ergebnis, eintrag, i) {
          if (i < 7) {
            ergebnis.push(eintrag);
          } else if (i === 7) {
            ergebnis.push(["Weitere", eintrag[1]]);
          } else {
            ergebnis[7][1] += eintrag[1];
          }
          return ergebnis;
        }, []);

      document.getElementById("chartKategorien").innerHTML = kuchenHtml(kategorieDaten);
      document.getElementById("chartWohnheime").innerHTML = kuchenHtml(wohnheimDaten);
    }

    function erzeugeWiederherstellungscode() {
      const zeichen = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      const zufall = new Uint32Array(12);
      crypto.getRandomValues(zufall);

      let code = "";
      for (let i = 0; i < 12; i++) {
        if (i > 0 && i % 4 === 0) code += "-";
        code += zeichen[zufall[i] % zeichen.length];
      }
      return code;
    }

    function fuelleWohnheime(aktuell) {
      uWohnheim.innerHTML = "";
      const liste = WOHNHEIME.slice();

      if (aktuell && liste.indexOf(aktuell) === -1) liste.push(aktuell);

      liste.forEach(function (name) {
        const option = document.createElement("option");
        option.value = name;
        option.textContent = name;
        uWohnheim.appendChild(option);
      });

      uWohnheim.value = aktuell || WOHNHEIME[0];
    }

    function oeffneBenutzerModal(id) {
      const benutzer = ladeBenutzer().find(function (b) {

      const festerAdmin = benutzer.id === "admin";
      const bin_ich = String(benutzer.id) === String(admin.id);

      bearbeiteterBenutzerId = benutzer.id;

      uId.value = benutzer.id;
      uName.value = benutzer.name || "";
      uEmail.value = benutzer.email || "";
      fuelleWohnheime(benutzer.wohnheim);
      uRole.value = benutzer.role === "admin" ? "admin" : "user";
      uCode.value = benutzer.recoveryCode || "";

      uPassword.type = "password";
      uTogglePw.textContent = "Anzeigen";
      uPassword.value = festerAdmin ? "" : (benutzer.password || "");
      uPassword.placeholder = festerAdmin ? "Fest im Code hinterlegt" : "";
      uPassword.required = !festerAdmin;

      userModalStatus.textContent = "";
      userModalNote.hidden = !(festerAdmin || bin_ich);
      userModalNote.textContent = festerAdmin
        ? "Dieses Admin-Konto ist fest in der Anmeldeseite hinterlegt und kann hier nur angesehen werden."
        : "Das ist dein eigenes Konto. Die Rolle kann deshalb nicht geändert werden.";

      [uName, uEmail, uWohnheim, uPassword, uRole, uNewCode, uTogglePw].forEach(function (feld) {
        feld.disabled = festerAdmin;

      if (passwort.length < 6) {
        userModalStatus.textContent = "Das Passwort muss mindestens 6 Zeichen lang sein.";

      const registrierte = leseJson("registeredUsers", []);
      const index = registrierte.findIndex(function (b) {

      if (index === -1) {
        userModalStatus.textContent = "Benutzer wurde nicht gefunden.";
        return;

        role: uRole.value,

    async function loescheAnzeige(id) {
      const anzeigen = ladeAnzeigen();
      const ziel = anzeigen.find(function (a) { return String(a.id) === String(id); });
      if (!ziel) return;
      if (!window.confirm('Anzeige "' + ziel.title + '" wirklich endgültig löschen?')) return;

      const buttons = adBody.querySelectorAll("[data-delete-ad]");
      buttons.forEach(function (button) { button.disabled = true; });

      try {
        if (!window.DHBWMarktData || !window.DHBWMarktData.client) {
          throw new Error("Die Datenbankverbindung ist nicht verfügbar. Bitte lade die Seite neu.");
        }

        const db = window.DHBWMarktData.client();
        const { data, error } = await db.rpc("admin_delete_listing", {
          p_listing_id: String(id)
        });

        if (error) {
          console.error("Admin-Anzeigenlöschung fehlgeschlagen:", error);
          if (error.code === "PGRST202" || error.code === "42883") {
            throw new Error("Die sichere Löschfunktion fehlt noch in Supabase. Bitte führe zuerst das SQL für admin_delete_listing aus.");
          }
          if (error.code === "42501") {
            throw new Error("Supabase hat die Löschung abgelehnt. Prüfe, ob dein Konto in profiles die Rolle 'admin' hat.");
          }
          throw new Error(error.message || "Unbekannter Datenbankfehler.");
        }

        if (data === false) {
          throw new Error("Die Anzeige wurde nicht gefunden oder konnte nicht gelöscht werden.");
        }

        await window.DHBWMarktData.bootstrapCache();
        renderStats();
        renderCharts();
        renderBenutzer();
        renderAnzeigen();
        zeigeToast("Anzeige erfolgreich gelöscht.");
      } catch (fehler) {
        console.error("Anzeige konnte nicht gelöscht werden:", fehler);
        window.alert("Anzeige konnte nicht gelöscht werden.\n\n" + (fehler.message || fehler));
      } finally {
        buttons.forEach(function (button) { button.disabled = false; });
      }
    }

    if (admin && admin.role === "admin") {
      (async function ladeAdminDaten() {
        try {
          await window.DHBWMarktData.bootstrapCache();
          const user = await window.DHBWMarktData.currentUser();
          const { data: profile, error } = await window.DHBWMarktData.client()
            .from("profiles").select("role").eq("id", user.id).single();
          if (error || !profile || profile.role !== "admin") {
            window.alert("Dein Konto hat keine Admin-Berechtigung in Supabase.");
            window.location.href = "index.html";
            return;
          }
          // Die Anzahl der Konten aus der gemeinsamen Supabase-Datenbank lesen.
          // registeredUsers in localStorage enthält nur lokale/zuletzt synchronisierte Daten.
          const { count, error: countError } = await window.DHBWMarktData.client()
            .from("profiles")
            .select("id", { count: "exact", head: true });
          if (countError) {
            console.error("Benutzeranzahl konnte nicht aus Supabase geladen werden:", countError);
          } else if (Number.isInteger(count)) {
            echteBenutzerAnzahl = count;
          }

          // Die Benutzerverwaltung ist deaktiviert und wird bereits beim ersten Rendern per CSS ausgeblendet.
          alleNeuZeichnen();
        } catch (error) {
          console.error(error);
          window.alert("Admin-Daten konnten nicht geladen werden: " + (error.message || error));
        }
      })();
    }
  </script>
</body>
</html>
