<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nachrichten | dhbwmarkt</title>

  <style>
    :root {
      --red: #e2001a;
      --red-dark: #b40014;
      --ink: #1a1a1a;
      --ink-soft: #5f5f5f;
      --bg: #ffffff;
      --bg-alt: #f5f5f5;
      --border: #e6e6e6;
      --border-strong: #cfcfcf;
      --bubble-other: #f0f0f0;
      --hover: #f7f7f7;
      --active: #fdeced;
    }

    body.dark-mode {
      --ink: #f5f5f5;
      --ink-soft: #b0b0b0;
      --bg: #1b1b1b;
      --bg-alt: #101010;
      --border: #333333;
      --border-strong: #555555;
      --bubble-other: #2c2c2c;
      --hover: #242424;
      --active: #3a1a1e;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      color: var(--ink);
      background: var(--bg-alt);
      font-family: Arial, Helvetica, sans-serif;
    }

    button, input, textarea { font: inherit; }
    a { color: var(--red); text-decoration: none; }
    a:hover { text-decoration: underline; }
    :focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

    /* Header / Footer */
    .header { padding: 16px 20px; background: var(--bg); border-bottom: 3px solid var(--red); }
    .header-content, .footer-content {
      width: 100%; max-width: 1000px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between; gap: 20px;
    }
    .logo { color: var(--ink); font-size: 26px; font-weight: 900; }
    .logo-red { color: var(--red); }
    .back-link { font-size: 14px; font-weight: 700; }
    .footer { padding: 20px; color: #fff; background: var(--red); font-size: 14px; }
    .footer a { color: #fff; font-weight: 700; }

    .main { width: 100%; max-width: 1000px; margin: 0 auto; padding: 24px 20px 40px; flex: 1; }

    /* Gesamtfenster */
    .chat-layout {
      display: grid;
      grid-template-columns: 340px 1fr;
      height: calc(100vh - 230px);
      min-height: 480px;
      overflow: hidden;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
    }

    /* ---------- Linke Spalte ---------- */
    .side { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--border); }

    .side-head { padding: 18px 20px; border-bottom: 1px solid var(--border); }
    .side-head h1 { margin: 0; font-size: 20px; }

    .conv-list { flex: 1; overflow-y: auto; }

    .conv-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 20px;
      color: var(--ink);
      background: none;
      border: 0;
      border-bottom: 1px solid var(--border);
      text-align: left;
      cursor: pointer;
    }
    .conv-item:hover { background: var(--hover); }
    .conv-item.active { background: var(--active); }

    .conv-body { flex: 1; min-width: 0; }
    .conv-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .conv-name { font-size: 14.5px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .conv-time { flex-shrink: 0; color: var(--ink-soft); font-size: 11.5px; }
    .conv-ad { margin-top: 1px; color: var(--ink-soft); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .conv-last { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 3px; }
    .conv-last span:first-child { color: var(--ink-soft); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .conv-item.unread .conv-name,
    .conv-item.unread .conv-last span:first-child { color: var(--ink); font-weight: 700; }

    .unread-badge {
      min-width: 20px; padding: 2px 6px; flex-shrink: 0;
      color: #fff; background: var(--red);
      border-radius: 10px; font-size: 11px; font-weight: 700; text-align: center;
    }

    .list-empty { padding: 40px 24px; color: var(--ink-soft); font-size: 14px; line-height: 1.6; text-align: center; }

    /* Avatare */
    .avatar {
      width: 44px; height: 44px; flex-shrink: 0; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      color: #fff; background: var(--red); border-radius: 50%;
      font-size: 15px; font-weight: 900;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .avatar.small { width: 40px; height: 40px; font-size: 14px; }

    /* ---------- Rechte Spalte ---------- */
    .chat-box { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
    .chat-empty {
      margin: auto; padding: 24px; color: var(--ink-soft); text-align: center; font-size: 15px; line-height: 1.6;
    }
    .chat-empty svg { display: block; margin: 0 auto 12px; opacity: 0.4; }
    .chat-active { display: flex; flex-direction: column; flex: 1; min-height: 0; }
    .chat-active[hidden], .chat-empty[hidden] { display: none; }

    .chat-head {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 20px; border-bottom: 1px solid var(--border);
    }
    .chat-head-text { flex: 1; min-width: 0; }
    .chat-head-text strong { display: block; font-size: 16px; }
    .delete-chat-btn { flex-shrink: 0; padding: 9px 12px; color: var(--red); background: transparent; border: 1px solid var(--red); border-radius: 20px; font-size: 12px; font-weight: 700; cursor: pointer; }
    .delete-chat-btn:hover { color: #fff; background: var(--red); }
    .delete-chat-btn:disabled { opacity: .6; cursor: wait; }

    .ad-chip {
      display: inline-flex; align-items: center; gap: 6px; max-width: 100%;
      margin-top: 2px; font-size: 12.5px; font-weight: 700;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    .mobile-back {
      display: none; width: 36px; height: 36px; flex-shrink: 0;
      color: var(--ink); background: none;
      border: 1px solid var(--border-strong); border-radius: 50%;
      font-size: 16px; cursor: pointer;
    }

    .chat-messages {
      flex: 1; min-height: 0; overflow-y: auto; padding: 20px;
      display: flex; flex-direction: column; gap: 6px;
      background: var(--bg-alt);
    }

    .day-sep { align-self: center; margin: 12px 0 6px; padding: 3px 12px; color: var(--ink-soft); background: var(--bg); border: 1px solid var(--border); border-radius: 12px; font-size: 11.5px; }

    .msg {
      max-width: 72%; padding: 9px 13px 6px; overflow-wrap: anywhere; white-space: pre-wrap;
      font-size: 14.5px; line-height: 1.4; border-radius: 16px;
    }
    .msg.me { align-self: flex-end; color: #fff; background: var(--red); border-bottom-right-radius: 4px; }
    .msg.other { align-self: flex-start; background: var(--bg); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
    .msg-time { display: block; margin-top: 3px; font-size: 10.5px; text-align: right; opacity: 0.7; }

    .no-messages { margin: auto; color: var(--ink-soft); font-size: 14px; text-align: center; }

    .chat-form { display: flex; align-items: flex-end; gap: 10px; padding: 12px 16px; border-top: 1px solid var(--border); background: var(--bg); }
    .chat-form textarea {
      flex: 1; min-height: 44px; max-height: 120px; padding: 11px 16px; resize: none;
      color: var(--ink); background: var(--bg-alt);
      border: 1px solid var(--border); border-radius: 22px; font-size: 14.5px;
    }
    .chat-form textarea:focus { border-color: var(--red); outline: 0; }
    .send-btn {
      width: 44px; height: 44px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      color: #fff; background: var(--red); border: 0; border-radius: 50%; cursor: pointer;
    }
    .send-btn:hover { background: var(--red-dark); }

    /* ---------- Handy ---------- */
    @media (max-width: 760px) {
      .main { padding: 12px 0 0; }
      .chat-layout {
        grid-template-columns: 1fr;
        height: calc(100vh - 150px);
        border-left: 0; border-right: 0; border-radius: 0;
      }
      .chat-layout .chat-box { display: none; }
      .chat-layout.chat-open .side { display: none; }
      .chat-layout.chat-open .chat-box { display: flex; }
      .side { border-right: 0; }
      .mobile-back { display: inline-flex; align-items: center; justify-content: center; }
      .msg { max-width: 85%; }
    }
  </style>
</head>

<body>
  <header class="header">
    <div class="header-content">
      <a class="logo" href="index.html"><span class="logo-red">dhbw</span>markt</a>
      <a class="back-link" href="index.html">Zurück zur Hauptseite</a>
    </div>
  </header>

  <main class="main">
    <div class="chat-layout" id="chatLayout">

      <aside class="side">
        <div class="side-head"><h1>Nachrichten</h1></div>
        <div class="conv-list" id="convList"></div>
      </aside>

      <section class="chat-box">
        <div class="chat-empty" id="chatEmpty">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="5" width="18" height="14" rx="2"></rect>
            <path d="M3 7l9 6 9-6"></path>
          </svg>
          Wähle links ein Gespräch aus.
        </div>

        <div class="chat-active" id="chatActive" hidden>
          <div class="chat-head">
            <button class="mobile-back" id="mobileBack" type="button" aria-label="Zurück zur Liste">←</button>
            <span id="chatAvatar"></span>
            <div class="chat-head-text">
              <strong id="chatPartner"></strong>
              <a class="ad-chip" id="chatAd" href="#"></a>
            </div>
            <button class="delete-chat-btn" id="deleteChatBtn" type="button">Chat löschen</button>
          </div>

          <div class="chat-messages" id="chatMessages"></div>

          <form class="chat-form" id="chatForm">
            <textarea id="chatInput" rows="1" maxlength="1000" placeholder="Nachricht schreiben …" aria-label="Nachricht"></textarea>
            <button class="send-btn" type="submit" aria-label="Senden">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
              </svg>
            </button>
          </form>
        </div>
      </section>

    </div>
  </main>

  <footer class="footer">
    <div class="footer-content">
      <span>&copy; 2026 dhbwmarkt</span>
      <a href="impressum.html">Impressum</a>
      <a href="datenschutz.html">Datenschutz</a>
    </div>
  </footer>

  
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="supabase-data.js?v=20261020-chat-delete-fix" onerror="this.onerror=null;this.src='https://raw.githubusercontent.com/Jannic-Schneider/dhbwmarkt/main/supabase-data.js?v=20261020-chat-delete-fix';"></script>
<script>
    "use strict";

    // ===== Theme =====
    function istNacht() {
      const test = localStorage.getItem("testNacht");
      if (test === "an") return true;
      if (test === "aus") return false;
      const stunde = new Date().getHours();
      return stunde >= 20 || stunde < 7;
    }

    function ladeGespeichertesTheme() {
      const auto = localStorage.getItem("autoTheme") === "on";
      const dunkel = auto ? istNacht() : localStorage.getItem("theme") === "dark";
      document.body.classList.toggle("dark-mode", dunkel);
    }
    ladeGespeichertesTheme();

    // ===== Hilfsfunktionen =====
    function leseJson(key, fallback) {
      try {
        const wert = JSON.parse(localStorage.getItem(key));
        return wert === null || wert === undefined ? fallback : wert;
      } catch (fehler) {
        return fallback;
      }
    }

    function escapeHtml(text) {
      return String(text ?? "")
        .replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;").replaceAll("'", "&#039;");
    }

    function initialen(name) {
      const teile = String(name || "").trim().split(/\s+/).filter(Boolean);
      if (!teile.length) return "?";
      return teile.slice(0, 2).map(function (t) { return t.charAt(0).toUpperCase(); }).join("");
    }

    function avatarHtml(id, name, klein) {
      const bild = id ? localStorage.getItem("profileImage-" + id) : "";
      const inhalt = bild
        ? '<img src="' + escapeHtml(bild) + '" alt="">'
        : escapeHtml(initialen(name));
      return '<span class="avatar' + (klein ? " small" : "") + '">' + inhalt + "</span>";
    }

    function uhrzeit(d) {
      return d.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
    }

    // Kurze Zeit für die Liste: Uhrzeit (heute) oder Datum
    function listenZeit(iso) {
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return "";
      return d.toDateString() === new Date().toDateString()
        ? uhrzeit(d)
        : d.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit" });
    }

    // Tages-Trenner im Chat
    function tagText(d) {
      const heute = new Date();
      const gestern = new Date();
      gestern.setDate(heute.getDate() - 1);

      if (d.toDateString() === heute.toDateString()) return "Heute";
      if (d.toDateString() === gestern.toDateString()) return "Gestern";
      return d.toLocaleDateString("de-DE", { day: "2-digit", month: "long", year: "numeric" });
    }

    function ladeNachrichten() {
      const liste = leseJson("nachrichten", []);
      return Array.isArray(liste) ? liste : [];
    }

    function speichereNachrichten(liste) {
      try {
        localStorage.setItem("nachrichten", JSON.stringify(liste));
        return true;
      } catch (fehler) {
        window.alert("Die Nachricht konnte nicht gespeichert werden.");
        return false;
      }
    }

    function konversationsId(anzeigeId, idA, idB) {
      return anzeigeId + "|" + [String(idA), String(idB)].sort().join("|");
    }

    // ===== Zugriffsschutz =====
    let ich = leseJson("loggedInUser", null);
    if (!ich) {
      window.location.href = "anmeldeseite_regestrierung.html";
    }

    // ===== Elemente =====
    const chatLayout = document.getElementById("chatLayout");
    const convList = document.getElementById("convList");
    const chatEmpty = document.getElementById("chatEmpty");
    const chatActive = document.getElementById("chatActive");
    const chatAvatar = document.getElementById("chatAvatar");
    const chatPartner = document.getElementById("chatPartner");
    const chatAd = document.getElementById("chatAd");
    const chatMessages = document.getElementById("chatMessages");
    const chatForm = document.getElementById("chatForm");
    const chatInput = document.getElementById("chatInput");
    const deleteChatBtn = document.getElementById("deleteChatBtn");

    let aktiveKonversation = null;
    let entwurf = null;

    // ===== Gespräche bilden =====
    function bildeKonversationen() {
      const meineId = String(ich.id);
      const karte = {};

      ladeNachrichten().forEach(function (n) {
        const binAbsender = String(n.vonId) === meineId;
        const binEmpfaenger = String(n.anId) === meineId;
        if (!binAbsender && !binEmpfaenger) return;

        if (!karte[n.konversationId]) {
          karte[n.konversationId] = {
            id: n.konversationId,
            anzeigeId: n.anzeigeId,
            anzeigeTitel: n.anzeigeTitel,
            partnerId: binAbsender ? n.anId : n.vonId,
            partnerName: binAbsender ? n.anName : n.vonName,
            letzte: n,
            ungelesen: 0
          };
        }

        const k = karte[n.konversationId];
        if (new Date(n.zeit) >= new Date(k.letzte.zeit)) k.letzte = n;
        if (binEmpfaenger && !n.gelesen) k.ungelesen += 1;
      });

      const liste = Object.values(karte).sort(function (a, b) {
        return new Date(b.letzte.zeit) - new Date(a.letzte.zeit);
      });

      if (entwurf && !karte[entwurf.id]) {
        liste.unshift({ ...entwurf, letzte: null, ungelesen: 0 });
      }

      return liste;
    }

    // ===== Liste zeichnen =====
    function renderListe() {
      const liste = bildeKonversationen();

      if (!liste.length) {
        convList.innerHTML =
          '<div class="list-empty">Noch keine Nachrichten.<br>' +
          'Klicke bei einer Anzeige auf „Verkäufer kontaktieren“, um ein Gespräch zu starten.</div>';
        return;
      }

      convList.innerHTML = liste.map(function (k) {
        const aktiv = aktiveKonversation && aktiveKonversation.id === k.id;
        const vorschau = k.letzte
          ? (String(k.letzte.vonId) === String(ich.id) ? "Du: " : "") + k.letzte.text
          : "Neues Gespräch";
        const zeit = k.letzte ? listenZeit(k.letzte.zeit) : "";

        return '<button type="button" class="conv-item' + (aktiv ? " active" : "") +
          (k.ungelesen ? " unread" : "") + '" data-konv="' + escapeHtml(k.id) + '">' +
          avatarHtml(k.partnerId, k.partnerName, false) +
          '<div class="conv-body">' +
            '<div class="conv-row"><span class="conv-name">' + escapeHtml(k.partnerName || "Unbekannt") + "</span>" +
            '<span class="conv-time">' + escapeHtml(zeit) + "</span></div>" +
            '<div class="conv-ad">' + escapeHtml(k.anzeigeTitel || "Anzeige") + "</div>" +
            '<div class="conv-last"><span>' + escapeHtml(vorschau) + "</span>" +
            (k.ungelesen ? '<span class="unread-badge">' + k.ungelesen + "</span>" : "") + "</div>" +
          "</div></button>";
      }).join("");
    }

    function markiereAlsGelesen(konvId) {
      const liste = ladeNachrichten();
      let geaendert = false;

      liste.forEach(function (n) {
        if (n.konversationId === konvId && String(n.anId) === String(ich.id) && !n.gelesen) {
          n.gelesen = true;
          geaendert = true;
        }
      });

      if (geaendert) {
        speichereNachrichten(liste);
        const eingehende = liste.filter(function (n) {
          return n.konversationId === konvId && String(n.anId) === String(ich.id);
        });
        const senderIds = [...new Set(eingehende.map(function (n) { return String(n.vonId); }))];
        senderIds.forEach(function (senderId) {
          const nachricht = eingehende.find(function (n) { return String(n.vonId) === senderId; });
          if (nachricht) {
            window.DHBWMarktData.markMessagesRead(nachricht.anzeigeId, senderId)
              .catch(function (error) { console.error("Lesestatus konnte nicht gespeichert werden:", error); });
          }
        });
      }
    }

    // ===== Chat zeichnen =====
    function renderChat() {
      if (!aktiveKonversation) {
        chatEmpty.hidden = false;
        chatActive.hidden = true;
        chatLayout.classList.remove("chat-open");
        return;
      }

      markiereAlsGelesen(aktiveKonversation.id);

      chatEmpty.hidden = true;
      chatActive.hidden = false;
      chatLayout.classList.add("chat-open");

      chatAvatar.innerHTML = avatarHtml(aktiveKonversation.partnerId, aktiveKonversation.partnerName, true);
      chatPartner.textContent = aktiveKonversation.partnerName || "Unbekannt";
      chatAd.textContent = "📦 " + (aktiveKonversation.anzeigeTitel || "Anzeige");
      chatAd.href = "anzeige.html?id=" + encodeURIComponent(aktiveKonversation.anzeigeId);

      const nachrichten = ladeNachrichten()
        .filter(function (n) { return n.konversationId === aktiveKonversation.id; })
        .sort(function (a, b) { return new Date(a.zeit) - new Date(b.zeit); });

      if (!nachrichten.length) {
        chatMessages.innerHTML = '<div class="no-messages">Schreibe die erste Nachricht.</div>';
      } else {
        let html = "";
        let letzterTag = "";

        nachrichten.forEach(function (n) {
          const d = new Date(n.zeit);
          const tag = d.toDateString();

          if (tag !== letzterTag) {
            html += '<div class="day-sep">' + escapeHtml(tagText(d)) + "</div>";
            letzterTag = tag;
          }

          const meine = String(n.vonId) === String(ich.id);
          html += '<div class="msg ' + (meine ? "me" : "other") + '">' + escapeHtml(n.text) +
            '<span class="msg-time">' + escapeHtml(uhrzeit(d)) + "</span></div>";
        });

        chatMessages.innerHTML = html;
      }

      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function oeffneKonversation(k) {
      aktiveKonversation = k;
      renderChat();
      renderListe();
    }

    // ===== Ereignisse =====
    convList.addEventListener("click", function (event) {
      const button = event.target.closest("[data-konv]");
      if (!button) return;

      const k = bildeKonversationen().find(function (eintrag) {
        return eintrag.id === button.dataset.konv;
      });
      if (k) oeffneKonversation(k);
    });

    deleteChatBtn.addEventListener("click", async function () {
      if (!aktiveKonversation || !aktiveKonversation.letzte) {
        window.alert("Ein noch leeres Gespräch kann nicht gelöscht werden.");
        return;
      }
      if (!window.confirm("Möchtest du diesen Chat wirklich löschen? Alle Nachrichten dieses Gesprächs werden für beide Beteiligten dauerhaft gelöscht.")) return;
      deleteChatBtn.disabled = true;
      deleteChatBtn.textContent = "Wird gelöscht …";
      try {
        const dataApi = window.DHBWMarktData;
        if (dataApi && typeof dataApi.deleteConversation === "function") {
          await dataApi.deleteConversation(aktiveKonversation.anzeigeId, aktiveKonversation.partnerId);
        } else {
          // Fallback für Deployments, bei denen eine ältere supabase-data.js geladen wird.
          let db = window.dhbwSupabase;
          if (!db) {
            if (!window.supabase || !window.DHBWMARKT_SUPABASE_URL || !window.DHBWMARKT_SUPABASE_PUBLISHABLE_KEY) {
              throw new Error("Supabase ist nicht verfügbar. Bitte lade die Seite später erneut.");
            }
            db = window.supabase.createClient(
              window.DHBWMARKT_SUPABASE_URL,
              window.DHBWMARKT_SUPABASE_PUBLISHABLE_KEY
            );
            window.dhbwSupabase = db;
          }
          const { data: authData, error: authError } = await db.auth.getUser();
          if (authError) throw authError;
          const user = authData && authData.user;
          if (!user) throw new Error("Bitte melde dich erneut an.");
          const listingId = String(aktiveKonversation.anzeigeId);
          const partnerId = String(aktiveKonversation.partnerId);
          const { data, error } = await db.rpc("delete_chat_conversation", {
            p_listing_id: listingId,
            p_partner_id: partnerId
          });
          if (error) throw error;
          if (data !== true) throw new Error("Das Gespräch wurde nicht gefunden oder bereits gelöscht.");
          const cached = leseJson("nachrichten", []);
          localStorage.setItem("nachrichten", JSON.stringify(
            (Array.isArray(cached) ? cached : []).filter(function (message) {
              return !(String(message.anzeigeId) === listingId &&
                [String(message.vonId), String(message.anId)].includes(partnerId) &&
                [String(message.vonId), String(message.anId)].includes(String(user.id)));
            })
          ));
        }
        aktiveKonversation = null;
        entwurf = null;
        if (dataApi && typeof dataApi.bootstrapCache === "function") {
          await dataApi.bootstrapCache();
        }
        renderChat();
        renderListe();
      } catch (error) {
        console.error("Chat konnte nicht gelöscht werden:", error);
        window.alert("Chat konnte nicht gelöscht werden: " + (error.message || error));
      } finally {
        deleteChatBtn.disabled = false;
        deleteChatBtn.textContent = "Chat löschen";
      }
    });

    document.getElementById("mobileBack").addEventListener("click", function () {
      aktiveKonversation = null;
      renderChat();
      renderListe();
    });

    chatForm.addEventListener("submit", async function (event) {
      event.preventDefault();
      if (!aktiveKonversation) return;
      const text = chatInput.value.trim();
      if (!text) return;
      try {
        await window.DHBWMarktData.sendMessage(aktiveKonversation.anzeigeId, aktiveKonversation.partnerId, text);
        await window.DHBWMarktData.bootstrapCache();
      } catch (error) {
        console.error(error);
        window.alert("Die Nachricht konnte nicht gesendet werden: " + (error.message || error));
        return;
      }
      entwurf = null;
      chatInput.value = "";
      renderChat();
      renderListe();
    });

    // Enter sendet, Shift+Enter macht eine neue Zeile
    chatInput.addEventListener("keydown", function (event) {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        chatForm.requestSubmit();
      }
    });

    // Nachrichten automatisch aktualisieren, ohne dass die Seite neu geladen werden muss.
    let aktualisierungLaeuft = false;
    let letzterNachrichtenStand = "";

    async function aktualisiereNachrichten() {
      if (aktualisierungLaeuft || document.visibilityState === "hidden") return;
      aktualisierungLaeuft = true;
      try {
        await window.DHBWMarktData.bootstrapCache();
        const aktuelleNachrichten = localStorage.getItem("nachrichten") || "[]";
        if (aktuelleNachrichten !== letzterNachrichtenStand) {
          letzterNachrichtenStand = aktuelleNachrichten;
          renderChat();
          renderListe();
        }
      } catch (error) {
        console.warn("Automatische Nachrichtenaktualisierung fehlgeschlagen:", error);
      } finally {
        aktualisierungLaeuft = false;
      }
    }

    // Sofortige Aktualisierung über Supabase Realtime, sofern aktiviert.
    try {
      const db = window.DHBWMarktData.client();
      const nachrichtenKanal = db.channel("dhbwmarkt-nachrichten-" + ich.id);
      nachrichtenKanal
        .on("postgres_changes", {
          event: "*", schema: "public", table: "nachrichten",
          filter: "recipient_id=eq." + ich.id
        }, aktualisiereNachrichten)
        .on("postgres_changes", {
          event: "*", schema: "public", table: "nachrichten",
          filter: "sender_id=eq." + ich.id
        }, aktualisiereNachrichten)
        .subscribe();
    } catch (error) {
      console.warn("Supabase Realtime nicht verfügbar; es wird regelmäßig aktualisiert.", error);
    }

    // Fallback: auch ohne Realtime alle 5 Sekunden prüfen.
    window.setInterval(aktualisiereNachrichten, 5000);
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "visible") aktualisiereNachrichten();
    });

    // Änderungen aus anderen Tabs live übernehmen
    window.addEventListener("storage", function (event) {
      if (event.key !== "nachrichten") return;
      letzterNachrichtenStand = event.newValue || "";
      renderChat();
      renderListe();
    });

    // ===== Start =====
    function starte() {
      const parameter = new URLSearchParams(window.location.search);
      const anzeigeId = parameter.get("anzeige");
      const partnerId = parameter.get("an");

      if (anzeigeId && partnerId) {
        if (String(partnerId) === String(ich.id)) {
          window.location.href = "nachrichten.html";
          return;
        }

        const anzeigen = leseJson("anzeigen", []);
        const anzeige = anzeigen.find(function (a) { return String(a.id) === String(anzeigeId); });

        const id = konversationsId(anzeigeId, ich.id, partnerId);
        const vorhanden = bildeKonversationen().find(function (k) { return k.id === id; });

        if (vorhanden) {
          aktiveKonversation = vorhanden;
        } else {
          entwurf = {
            id: id,
            anzeigeId: anzeigeId,
            anzeigeTitel: anzeige ? anzeige.title : "Anzeige",
            partnerId: partnerId,
            partnerName: anzeige ? (anzeige.ownerName || anzeige.ownerEmail) : "Verkäufer"
          };
          aktiveKonversation = entwurf;
        }
      }

      renderChat();
      renderListe();
    }

    (async function ladeGemeinsameNachrichten() {
      try {
        await window.DHBWMarktData.bootstrapCache();
        ich = leseJson("loggedInUser", null);
      } catch (error) {
        console.error("Nachrichten konnten nicht geladen werden:", error);
      }
      if (ich) starte();
      else window.location.href = "anmeldeseite_regestrierung.html";
    })();
  </script>
